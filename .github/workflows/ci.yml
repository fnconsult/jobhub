name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://jobhub:jobhub@localhost:5432/jobhub
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The images .github/workflows/deploy.yml ships to the VPS: a Dockerfile that no longer
  # builds should fail here, on the pull request, not during a deployment.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile, target: web }
          - { name: migrate, dockerfile: apps/web/Dockerfile, target: migrate }
          - { name: worker, dockerfile: apps/worker/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
