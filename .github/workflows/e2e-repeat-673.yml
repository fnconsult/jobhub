# TEMPORARY (#673): the e2e suite, four times at once, on pushes to this branch, to catch the 404 with its servers' logs.
# Removed before the pull request is merged.
name: e2e repeat (#673)

on:
  push:
    branches: [claude/e2e-dev-server-404]

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://jobhub:jobhub@localhost:5432/jobhub
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # The E2E run's traces, builds and next dev servers fill the runner's 14 GB (ENOSPC, main on 2026-11-02): drop the
      # preinstalled SDKs this job never uses before anything is written.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          # HEAD and its first parent, for the Legal Text Versions' check: on a pull request its merge commit and the
          # base; on main the squashed merge and main before it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A Legal Text Version in effect is never edited (ADR-0062): a correction is a new version. A substantial one is
      # merged 30 days before it takes effect (#547): run on the pull request, and again on main on the day of the merge,
      # so one merged late, with no new push since its pull request was checked, turns main red and cannot be deployed.
      # One Version for the web app and the worker (#559): apps/web and apps/worker repeat the root package.json's.
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      # The screenshot specs run here for their axe checks; their comparisons run in the `screenshots` job, in the
      # Playwright image the baselines are drawn in, whose fonts match theirs.
      - run: npm run test:e2e
        env:
          E2E_SCREENSHOTS: "0"
      # A failed run's traces, and what its web servers printed (#673): the suite's (its log is the Candidates' mailbox),
      # the ones specs start for themselves (e2e/support/server-log.ts) and `next dev`'s own log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.attempt }}
          path: |
            test-results/
            /tmp/jobhub-e2e-*/server.log
            apps/web/.next/dev/logs/
          retention-days: 14

