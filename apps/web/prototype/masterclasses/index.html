      <p class="xs meta" style="margin:-.5rem 0 0">« ${m.title} », ${SELLER_LABEL[m.seller].toLowerCase()} ${m.sellerName}.</p>
      ${fld("s-motif", "Motif", `<select id="s-motif" data-s="motif" ${inv("motif", "s-motif")}>${MOTIFS.map(([v, l]) => `<option value="${v}" ${f.motif === v ? "selected" : ""}>${l}</option>`).join("")}</select>`, "", e.motif)}
      ${fld("s-text", "Pourquoi ce contenu est-il illicite ?", `<textarea id="s-text" data-s="text" ${inv("text", "s-text")} placeholder="Précisez ce qui pose problème et où (minute de la vidéo, page du PDF…).">${esc(f.text)}</textarea>`, "", e.text)}
      <div class="fgrid">
        ${fld("s-name", "Votre nom", `<input id="s-name" type="text" autocomplete="name" data-s="name" value="${esc(f.name)}" ${inv("name", "s-name")}>`, anon ? "facultatif pour ce motif" : "", e.name)}
        ${fld("s-mail", "Votre e-mail", `<input id="s-mail" type="email" autocomplete="email" data-s="mail" value="${esc(f.mail)}" ${inv("mail", "s-mail")}>`, anon ? "facultatif pour ce motif" : "pour recevoir la décision", e.mail)}
      </div>
      <label class="check"><input type="checkbox" data-schk="good" ${f.good ? "checked" : ""} ${inv("good", "s-good")}> <span>Je déclare de bonne foi que les informations de ce signalement sont exactes et complètes.</span></label>
      ${e.good ? `<p class="err" id="e-s-good">${e.good}</p>` : ""}
      ${errs ? `<p class="note danger small" role="alert" style="margin:0"><b>${errs} champ${errs > 1 ? "s" : ""} à corriger.</b></p>` : ""}
      <div class="row"><button type="button" class="btn primary" data-ssend>Envoyer le signalement</button></div>
      <p class="xs meta" style="margin:0">Vos coordonnées servent seulement à traiter ce signalement ; elles ne sont pas transmises à l'auteur. Un signalement manifestement abusif peut être ignoré.</p>
    </form>`;
  return h`<div class="pub">
    <header class="top"><span class="brandp"><i aria-hidden="true">J</i>Jobbbox</span><button class="btn sm" data-noop>Se connecter</button></header>
    <main class="page" id="contenu" tabindex="-1"><div class="wrap narrow">${content}</div></main>
  </div>`;
}

const RENDER = { catalogue: scrCatalogue, masterclass: scrMasterclass, commande: scrCommande, lecteur: scrLecteur, "coach-creer": scrCoachCreer, "coach-suivi": scrCoachSuivi, "admin-relecture": scrAdmin };

// ───────────────────────────── Rendu + barre prototype ─────────────────────────────
function proto() {
  const mcOn = ["masterclass", "commande", "signaler"].includes(S.screen);
  return h`<div class="proto" role="region" aria-label="Barre du prototype">
    <label class="vh" for="p-screen">Écran</label>
    <select id="p-screen" data-pscreen>${Object.entries(SCREENS).map(([k, v]) => `<option value="${k}" ${S.screen === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    ${mcOn ? `<span class="sep" aria-hidden="true"></span><label class="vh" for="p-mc">Masterclass</label><select id="p-mc" data-pmc>${MCS.map((m) => `<option value="${m.id}" ${mcId() === m.id ? "selected" : ""}>${FORMAT[m.format]}${m.price ? "" : " gratuite"} · ${m.title.slice(0, 16)}…</option>`).join("")}</select>` : ""}
    <span class="sep" aria-hidden="true"></span><button data-theme aria-pressed="${S.theme === "dark"}">${S.theme === "dark" ? "Sombre" : "Clair"}</button>
  </div>`;
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  const active = document.activeElement;
  const key = active && active !== document.body ? (active.id || (active.dataset && Object.keys(active.dataset).length ? active.tagName + JSON.stringify(active.dataset) + (active.value ?? "") : null)) : null;
  let html;
  if (S.screen === "signaler") html = scrSignaler();
  else {
    const r = RENDER[S.screen]();
    const sb = { cand: sidebarCandidate, coach: sidebarCoach, bo: sidebarBo }[SHELL[S.screen]]();
    html = `<div class="app ${S.drawer ? "drawer" : ""}">${sb}<div class="scrim" data-drawer></div><div class="main">${topbar(r.title, r.top ?? "")}${r.body}</div></div>`;
  }
  document.getElementById("root").innerHTML = `<a class="skip" href="#contenu">Aller au contenu</a>${html}${proto()}`;
  document.title = `${SCREENS[S.screen]} — Masterclasses (prototype)`;
  if (S.focus) { const el = document.querySelector(S.focus); if (el) el.focus(); S.focus = null; }
  else if (key) {
    const el = document.getElementById(key) || [...document.querySelectorAll("button, select, input, textarea")].find((e) => e.dataset && (e.tagName + JSON.stringify(e.dataset) + (e.value ?? "")) === key);
    el?.focus();
  }
}
const firstErr = () => { S.focus = "[aria-invalid='true']"; };

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a");
  if (!el) return;
  const d = el.dataset;
  if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();
  if (d.noop !== undefined) return;
  if (d.drawer !== undefined) return set({ drawer: !S.drawer });
  if (d.theme !== undefined) return set({ theme: S.theme === "dark" ? "light" : "dark" });
  if (d.go) return set({ screen: d.go, drawer: false, sDone: false, sTried: false, stage: "form" });
  if (d.open) return set({ screen: "masterclass", mc: d.open, drawer: false, focus: "#contenu" });
  if (d.ffmt !== undefined) return set({ fFormat: d.ffmt });
  if (d.freset !== undefined) return set({ fTheme: "", fFormat: "", fWhen: "" });
  if (d.buy) return set({ screen: "commande", mc: d.buy, cgv: false, ipr: false, dig: false, tried: false, stage: "form", focus: "#contenu" });
  if (d.pay !== undefined) {
    if (!S.cgv) { firstErr(); return set({ tried: true }); }
    return set({ stage: mc().price === 0 ? "done" : "stripe", focus: "#contenu" });
  }
  if (d.stage) return set({ stage: d.stage, focus: "#contenu" });
  if (d.lect) return set({ screen: "lecteur", mode: d.lect, mc: d.lect === "live" ? "pitch" : "linkedin", stage: "form" });
  if (d.play !== undefined) return set({ playing: !S.playing });
  if (d.cc !== undefined) return set({ cc: !S.cc });
  if (d.chap !== undefined) return set({ t: Math.max(+d.chap, 1) });
  if (d.csubmit !== undefined) {
    const c = S.c;
    if (!c.title.trim() || !c.prog.trim() || !c.licence || (c.format !== "replay" && !c.speakerOnly)) { firstErr(); return set({ cTried: true }); }
    return set({ cSent: true, cTried: false, focus: "#h-sent" });
  }
  if (d.cnew !== undefined) return set({ cSent: false, c: { ...S.c, title: "", prog: "", licence: false, speakerOnly: false } });
  if (d.atab) return set({ atab: d.atab, drawer: false });
  if (d.rsel) return set({ rsel: d.rsel, rReason: "", rTried: false });
  if (d.rok !== undefined) { S.rDec[S.rsel] = { ok: true }; return set({ rTried: false }); }
  if (d.rko !== undefined) { if (!S.rReason.trim()) { firstErr(); return set({ rTried: true }); } S.rDec[S.rsel] = { ok: false, why: S.rReason }; return set({ rTried: false }); }
  if (d.gsel) return set({ gsel: d.gsel, gReason: "", gTried: false, gChoice: "retirer" });
  if (d.gdecide !== undefined) {
    if (!S.gReason.trim()) { firstErr(); return set({ gTried: true }); }
    S.gDec[S.gsel] = { label: { retirer: "Masterclass retirée, inscrits remboursés", restreindre: "Vente suspendue le temps de vérifier", maintenir: "Masterclass maintenue" }[S.gChoice] };
    return set({ gTried: false });
  }
  if (d.ssend !== undefined) {
    const f = S.s, anon = f.motif === "mineur";
    const ok = f.motif && f.text.trim().length >= 20 && f.good && (anon || (f.name.trim() && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.mail)));
    if (!ok) { firstErr(); return set({ sTried: true }); }
    return set({ sDone: true, focus: "#h-done" });
  }
  if (d.sreset !== undefined) return set({ sDone: false, sTried: false, s: { url: "", motif: "", text: "", name: "", mail: "", good: false } });
});
document.addEventListener("change", (e) => {
  const t = e.target, d = t.dataset;
  if (d.pscreen !== undefined) return set({ screen: t.value, mc: null, drawer: false, stage: "form", tried: false, cgv: false, ipr: false, dig: false, sDone: false, sTried: false });
  if (d.pmc !== undefined) return set({ mc: t.value, stage: "form", cgv: false, ipr: false, dig: false, tried: false });
  if (d.ftheme !== undefined) return set({ fTheme: t.value });
  if (d.fwhen !== undefined) return set({ fWhen: t.value });
  if (d.check) return set({ [d.check]: t.checked });
  if (d.speed !== undefined) return set({ speed: t.value });
  if (d.c && (t.tagName === "SELECT" || t.type === "radio")) { S.c[d.c] = t.value; return render(); }
  if (d.cchk) { S.c[d.cchk] = t.checked; return render(); }
  if (d.gchoice !== undefined) { S.gChoice = t.value; return; }
  if (d.s === "motif") { S.s.motif = t.value; return render(); }
  if (d.schk) { S.s[d.schk] = t.checked; return render(); }
});
document.addEventListener("input", (e) => {
  const t = e.target, d = t.dataset;
  if (d.seek !== undefined) { S.t = +t.value; return render(); }
  if (d.c && t.tagName !== "SELECT" && t.type !== "radio") S.c[d.c] = t.value;
  if (d.rreason !== undefined) S.rReason = t.value;
  if (d.greason !== undefined) S.gReason = t.value;
  if (d.s && d.s !== "motif") S.s[d.s] = t.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.drawer) { set({ drawer: false }); document.querySelector("[data-drawer]")?.focus(); }
});

readUrl(); writeUrl(); render();
</script>
</body>
</html>
