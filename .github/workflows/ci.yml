name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://jobhub:jobhub@localhost:5432/jobhub
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD and its first parent, for the Legal Text Versions' check: on a pull request its merge commit and the
          # base; on main the squashed merge and main before it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A Legal Text Version in effect is never edited (ADR-0062): a correction is a new version. A substantial one is
      # merged 30 days before it takes effect (#547): run on the pull request, and again on main on the day of the merge,
      # so one merged late, with no new push since its pull request was checked, turns main red and cannot be deployed.
      - run: npx tsx packages/help/scripts/check-legal-immutability.ts HEAD^1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      # The screenshot specs run here for their axe checks; their comparisons run in the `screenshots` job, in the
      # Playwright image the baselines are drawn in, whose fonts match theirs.
      - run: npm run test:e2e
        env:
          E2E_SCREENSHOTS: "0"

  # The screenshot baselines (#463, docs/agents/screenshot-baselines.md): every spec with a toHaveScreenshot, in the
  # Playwright image of the version the repo pins, as scripts/update-screenshot-baselines.sh draws them. A screen that
  # differs from its baseline fails the run.
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobhub
          POSTGRES_PASSWORD: jobhub
          POSTGRES_DB: jobhub
        options: >-
          --health-cmd "pg_isready -U jobhub -d jobhub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://jobhub:jobhub@postgres:5432/jobhub
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SCREENSHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      # The image's Playwright must be the one the repo pins, or its Chromium draws otherwise.
      - run: test "$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" = "1.63.0"
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      # The emails project too (e2e/email-html.spec.ts): its -linux baselines are drawn in this image, and compared only here.
      - run: npx playwright test --project=web --project=emails $(grep -l toHaveScreenshot e2e/*.spec.ts)
      # TEMPORARY (#511): print the shell's failed actual images into the log, to take CI's render as baselines. Removed before merge.
      - if: failure()
        run: for f in $(find test-results -name 'back-office*-actual.png'); do echo "BEGIN-PNG $f"; base64 -w0 "$f"; echo; echo "END-PNG"; done
      # A failed comparison's expected, actual and diff images, and its trace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-results
          path: test-results/
          retention-days: 14

  # The images .github/workflows/deploy.yml ships to the VPS: a Dockerfile that no longer
  # builds should fail here, on the pull request, not during a deployment.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile, target: web }
          - { name: migrate, dockerfile: apps/web/Dockerfile, target: migrate }
          - { name: worker, dockerfile: apps/worker/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
