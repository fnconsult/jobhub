# Jobbbox on the Hostinger VPS: one stack per environment (staging, production).
# Run by deploy/deploy.sh, never by hand without its variables. The images are built by
# .github/workflows/deploy.yml and pulled from GHCR, tagged with the commit SHA: the VPS
# builds nothing (a Next.js build needs more memory than the shared VPS should spare).
#
# The VPS's Traefik (shared with other apps) routes JOBHUB_HOST to the web container
# over its `n8n_default` network and gets the TLS certificate (resolver `mytlschallenge`).
# Secrets and configuration come from <JOBHUB_ROOT>/.env on the VPS, never from the repo
# (keys: .env.example; layout: docs/ops/hosting.md).

x-app-env: &app-env
  env_file:
    - path: ${JOBHUB_ENV_FILE:?JOBHUB_ENV_FILE is required}
  environment:
    DATABASE_URL: postgres://jobhub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/jobhub
    APP_URL: https://${JOBHUB_HOST:?JOBHUB_HOST is required}
    JOBHUB_REVISION: ${JOBHUB_REVISION}
    # Which Playbook Versions are served (ADR-0021): only Human-validated ones in production.
    JOBHUB_TARGET: ${JOBHUB_TARGET:?JOBHUB_TARGET is required}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: jobhub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app-env
    image: ${JOBHUB_IMAGES:?JOBHUB_IMAGES is required}/migrate:${JOBHUB_REVISION:?JOBHUB_REVISION is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-env
    image: ${JOBHUB_IMAGES:?JOBHUB_IMAGES is required}/web:${JOBHUB_REVISION:?JOBHUB_REVISION is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
      traefik:
        # Email intake's MTA (deploy/mta/compose.yml) posts each email here, over this network.
        aliases: ["${JOBHUB_SLUG}-web"]
    # Two routers (ADR-0094). The pages': when this container does not answer (a 502 or a 504 from Traefik), the `edge`
    # container's page replaces Traefik's bare text; the app's own answers, 500 and maintenance's 503 included, pass
    # untouched. The API's, above it: its JSON passes untouched, the 502 of a refused payment included. While this
    # container is not routed at all (stopped, starting, unhealthy), both routers are gone and `edge`'s takes the host.
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - "traefik.http.routers.${JOBHUB_SLUG:?JOBHUB_SLUG is required}.rule=Host(`${JOBHUB_HOST}`)"
      - "traefik.http.routers.${JOBHUB_SLUG}.priority=20"
      - "traefik.http.routers.${JOBHUB_SLUG}.entrypoints=websecure"
      - "traefik.http.routers.${JOBHUB_SLUG}.tls=true"
      - "traefik.http.routers.${JOBHUB_SLUG}.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${JOBHUB_SLUG}.service=${JOBHUB_SLUG}"
      - "traefik.http.routers.${JOBHUB_SLUG}.middlewares=${JOBHUB_SLUG}-unreachable"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.rule=Host(`${JOBHUB_HOST}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.priority=30"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.entrypoints=websecure"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.tls=true"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${JOBHUB_SLUG}-api.service=${JOBHUB_SLUG}"
      - "traefik.http.services.${JOBHUB_SLUG}.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${JOBHUB_SLUG}-unreachable.errors.status=502,504"
      - "traefik.http.middlewares.${JOBHUB_SLUG}-unreachable.errors.service=${JOBHUB_SLUG}-edge"
      - "traefik.http.middlewares.${JOBHUB_SLUG}-unreachable.errors.query=/__edge/{status}"
    restart: unless-stopped

  # Jobbbox's error page when the web app does not answer (ADR-0094, deploy/edge/nginx.conf): without it, Traefik
  # answers `404 page not found` for the whole time no web container is routed, each deploy included. Its router has
  # the lowest priority, so it only answers while the web container's are gone. Its files are the checkout's, read
  # from the directory (a single-file mount would keep the file an earlier revision's checkout replaced); deploy.sh
  # reloads it before the web container is replaced.
  edge:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/jobbbox-edge/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./edge:/etc/jobbbox-edge:ro
    networks:
      traefik:
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.rule=Host(`${JOBHUB_HOST}`)"
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.priority=1"
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.entrypoints=websecure"
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.tls=true"
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${JOBHUB_SLUG}-edge.service=${JOBHUB_SLUG}-edge"
      - "traefik.http.services.${JOBHUB_SLUG}-edge.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/__edge/502"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *app-env
    image: ${JOBHUB_IMAGES}/worker:${JOBHUB_REVISION}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  traefik:
    name: n8n_default
    external: true

volumes:
  postgres-data:
