name: Coach evals

# The Coach eval suite (#131) calls Claude for real, so it runs nightly and on pull requests that
# change the AI Coach's prompt, knowledge or model, not on every pull request.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: Models compared, comma-separated
        default: claude-opus-5-5,claude-sonnet-5-5
  pull_request:
    paths:
      - apps/web/src/coach/**
      - packages/coach-knowledge/**
      - packages/ai/src/env.ts
      - packages/ai/src/providers/anthropic.ts
      - apps/web/scripts/coach-eval.ts
      - .github/workflows/coach-evals.yml

concurrency:
  group: coach-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job whose every step skips still reports success: without the secret, the eval check would show
  # as passed though the suite never ran. Deciding here lets the eval job skip at the job level instead.
  credentials:
    runs-on: ubuntu-latest
    outputs:
      bedrock: ${{ steps.check.outputs.bedrock }}
    steps:
      - id: check
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          if [ -n "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            echo "bedrock=true" >> "$GITHUB_OUTPUT"
          else
            echo "bedrock=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_BEARER_TOKEN_BEDROCK is not set; the Coach eval suite did not run."
          fi

  eval:
    needs: credentials
    if: needs.credentials.outputs.bedrock == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_ENDPOINT: bedrock
      BEDROCK_REGION: eu-west-3
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          MODELS: ${{ inputs.models || 'claude-opus-5-5,claude-sonnet-5-5' }}
        run: npm run coach:eval -- --models "$MODELS" --out "$RUNNER_TEMP/coach-evals"
      - run: cat "$RUNNER_TEMP"/coach-evals/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coach-evals
          path: ${{ runner.temp }}/coach-evals
