# Opens the app where it was, signs the run's Candidate in when it asks (a run that only takes the key screens comes
# here first), and waits for a conversation's box.
appId: ai.jobbbox.app
---
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Se connecter à Jobbbox"
    file: sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "coach-message"
    timeout: 30000
