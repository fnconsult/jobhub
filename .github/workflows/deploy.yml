# Deploys Jobbbox to the Hostinger VPS over SSH (docs/ops/hosting.md).
#
# Manual only: `gh workflow run deploy.yml -f target=staging` (from the ref to deploy,
# default main). Staging may name a commit of main instead of the ref's head: `-f sha=<sha>`, or `-f sha=latest-green`
# for the newest commit of main CI has passed on. A push never deploys. Production also needs `confirm=jobbbox.ai`, and runs only a Version's tag
# vX.Y.Z on the prod branch, which the Promotion pushes (scripts/promote.ts, docs/ops/promotion.md, ADR-0063).
#
# One GitHub Environment per target (Settings → Environments), set up by
# scripts/setup/deploy-vps.sh:
#   variables  JOBHUB_ROOT (/opt/jobbbox/<target>), JOBHUB_HOST, JOBHUB_SLUG
#   secrets    VPS_HOST, VPS_USER, VPS_SSH_KEY
# Application secrets live in <JOBHUB_ROOT>/.env on the VPS, never in GitHub.
#
# The images (web, migrate, worker, mta) are built here and pushed to GHCR, tagged with the
# commit SHA; the VPS only pulls them, with this run's short-lived token. The images, the commit they carry, the VPS
# checkout and the GitHub Deployment record all use the commit `check` resolves (its `sha` output), not github.sha.
name: Deploy
run-name: Deploy ${{ inputs.target }} (${{ inputs.sha || github.ref_name }}) by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: "Production only: type jobbbox.ai to confirm"
        type: string
        default: ""
      sha:
        description: "Staging only: a commit of main (full or short SHA), or latest-green. Empty: the ref's head"
        type: string
        default: ""

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGES: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The environment's secrets and variables, without a Deployment record: `deploy` writes the one for the deployed commit.
    environment:
      name: ${{ inputs.target }}
      deployment: false
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy
      - name: Resolve the commit to deploy
        id: commit
        env:
          TARGET: ${{ inputs.target }}
          REQUESTED: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$REQUESTED" ]; then
            sha="$GITHUB_SHA"
          elif [ "$TARGET" = production ]; then
            echo "::error::'sha' is for staging only. Production deploys a Version's tag on prod (docs/ops/promotion.md)."
            exit 1
          elif [ "$REQUESTED" = latest-green ]; then
            # The newest commit of main's history among those a ci.yml run on main succeeded on.
            green=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
              --limit 100 --json headSha --jq '.[].headSha')
            sha=""
            for commit in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=100" --jq '.[].sha'); do
              if printf '%s\n' "$green" | grep -qx "$commit"; then sha="$commit"; break; fi
            done
            if [ -z "$sha" ]; then
              echo "::error::None of main's last 100 commits has a successful ci.yml run."
              exit 1
            fi
          elif printf '%s' "$REQUESTED" | grep -Eqx '[0-9a-f]{7,40}'; then
            if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REQUESTED" --jq .sha 2>&1); then
              echo "::error::No commit $REQUESTED in $GITHUB_REPOSITORY: $sha"
              exit 1
            fi
          else
            echo "::error::'sha' must be a commit SHA (7 to 40 hex digits) or latest-green, not '$REQUESTED'."
            exit 1
          fi
          if [ -n "$REQUESTED" ]; then
            # GitHub's comparison of the commit with main: "identical" when main is at it, "ahead" when main is past it.
            if ! compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status 2>&1); then
              echo "::error::Could not compare $sha with main: $compare"
              exit 1
            fi
            case "$compare" in
              identical | ahead) ;;
              *) echo "::error::$sha is not on main ($compare). Deploy a commit of main."; exit 1 ;;
            esac
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "▸ Commit to deploy: $sha${REQUESTED:+ (sha=$REQUESTED, from ${GITHUB_REF_NAME} at $GITHUB_SHA)}"
      - name: Check that Production runs a Promoted Version
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's comparison of this commit with prod: empty when prod does not exist (404), a failure otherwise.
          if compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...prod" --jq .status 2>&1); then
            export PROD_COMPARE="$compare"
          elif printf '%s' "$compare" | grep -q 'HTTP 404'; then
            export PROD_COMPARE=""
          else
            echo "::error::Could not compare $GITHUB_SHA with prod: $compare"
            exit 1
          fi
          node scripts/deploy/check-production-ref.mjs
      - name: Check confirmation, configuration and CI
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          JOBHUB_ROOT: ${{ vars.JOBHUB_ROOT }}
          JOBHUB_HOST: ${{ vars.JOBHUB_HOST }}
          JOBHUB_SLUG: ${{ vars.JOBHUB_SLUG }}
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TARGET" = production ] && [ "$CONFIRM" != jobbbox.ai ]; then
            echo "::error::Production deployment refused: type jobbbox.ai in 'confirm'."
            exit 1
          fi
          for v in VPS_HOST VPS_USER VPS_SSH_KEY JOBHUB_ROOT JOBHUB_HOST JOBHUB_SLUG; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set on the '$TARGET' environment. Run scripts/setup/deploy-vps.sh."
              exit 1
            fi
          done
          case "$JOBHUB_ROOT" in
            *"$TARGET"*) ;;
            *) echo "::error::JOBHUB_ROOT ($JOBHUB_ROOT) does not name '$TARGET'."; exit 1 ;;
          esac
          ci=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$ci" = 0 ]; then
            echo "::error::CI has not passed on $SHA. Deploy a commit CI has passed on (or -f sha=latest-green on staging)."
            exit 1
          fi
          echo "▸ $TARGET → $JOBHUB_HOST ($JOBHUB_ROOT, $JOBHUB_SLUG) at $SHA"

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile, target: web }
          - { name: migrate, dockerfile: apps/web/Dockerfile, target: migrate }
          - { name: worker, dockerfile: apps/worker/Dockerfile, target: "" }
          # Email intake's MTA (#580), run by the environment its .env names (deploy/mta/compose.yml).
          - { name: mta, dockerfile: apps/mta/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGES }}/${{ matrix.name }}:${{ needs.check.outputs.sha }}
          # What the Back Office, Mon compte and /api/health name (#559): the commit and the target, baked into the
          # image. The Version is the root package.json's, bundled by the build itself (apps/web/src/release).
          build-args: |
            JOBHUB_COMMIT=${{ needs.check.outputs.sha }}
            JOBHUB_TARGET=${{ inputs.target }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      deployments: write
    # The environment's secrets, protection rules and variables. GitHub's own Deployment record would name the ref's
    # head: the first step writes the record for the deployed commit instead, the last one its outcome.
    environment:
      name: ${{ inputs.target }}
      deployment: false
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - name: Record the Deployment
        id: record
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI was checked by `check`; required_contexts=[] keeps GitHub from checking it again on this commit.
          id=$(jq -n --arg sha "$SHA" --arg target "$TARGET" --arg ref "$GITHUB_REF_NAME" '{
              ref: $sha, environment: $target, auto_merge: false, required_contexts: [],
              production_environment: ($target == "production"), description: "Deploy \($ref) at \($sha)"
            }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          echo "▸ Deployment $id: $TARGET at $SHA"

      - name: Deploy on the VPS
        # Pinned to a SHA: this action receives the VPS key.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          JOBHUB_TARGET: ${{ inputs.target }}
          JOBHUB_ROOT: ${{ vars.JOBHUB_ROOT }}
          JOBHUB_HOST: ${{ vars.JOBHUB_HOST }}
          JOBHUB_SLUG: ${{ vars.JOBHUB_SLUG }}
          JOBHUB_REVISION: ${{ needs.check.outputs.sha }}
          JOBHUB_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          JOBHUB_IMAGES: ${{ env.IMAGES }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: JOBHUB_TARGET,JOBHUB_ROOT,JOBHUB_HOST,JOBHUB_SLUG,JOBHUB_REVISION,JOBHUB_REPO,JOBHUB_IMAGES,GHCR_TOKEN
          script: |
            set -e
            app="$JOBHUB_ROOT/app"
            [ -d "$app/.git" ] || git clone --quiet "$JOBHUB_REPO" "$app"
            git -C "$app" fetch --quiet origin "$JOBHUB_REVISION"
            git -C "$app" checkout --quiet --force "$JOBHUB_REVISION"
            git -C "$app" clean --quiet -fdx
            "$app/deploy/deploy.sh"

      - name: Smoke test
        env:
          JOBHUB_HOST: ${{ vars.JOBHUB_HOST }}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$JOBHUB_HOST/api/health" || true)
            [ "$code" = 200 ] && { echo "✓ https://$JOBHUB_HOST/api/health → 200"; exit 0; }
            sleep 6
          done
          echo "::error::https://$JOBHUB_HOST/api/health answered $code"
          exit 1

      - name: Record the Deployment's outcome
        if: always() && steps.record.outputs.id
        env:
          ID: ${{ steps.record.outputs.id }}
          OUTCOME: ${{ job.status }}
          JOBHUB_HOST: ${{ vars.JOBHUB_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$OUTCOME" in success) state=success ;; cancelled) state=inactive ;; *) state=failure ;; esac
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" -f state="$state" \
            -f environment_url="https://$JOBHUB_HOST" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
