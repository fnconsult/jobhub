# Sign-in by code (#686, ADR-0083): the run's Candidate asks for their sign-in email, then types the code it holds, which
# the stack's helper reads from the platform's mailbox (scripts/sign-in-code.js).
appId: ai.jobbbox.app
---
# In an iPad's Split View, Maestro takes the screen for the app's window turned (1032 × 683 pt) while the app's elements
# are placed on the whole landscape screen (its half at x 693 to 1376): scrollUntilVisible, which wants all of an
# element on that screen, found half of the sign-in field and swiped until its timeout (run 42413471132,
# ipad-split-half-light, « Visibility Percent: 0.4955 »). There, slow swipes until it shows, as elsewhere.
# At the largest text size the field is below the screen's fold: scrolled to.
- extendedWaitUntil:
    visible: "Se connecter à Jobbbox"
    timeout: 30000
- runFlow:
    when:
      true: ${WINDOW != 'split-half'}
    commands:
      - scrollUntilVisible:
          element:
            id: "sign-in-email"
          direction: DOWN
          # Five screens down at the largest text size on an iPhone SE, a swipe every 4 s: 20 s, Maestro's default, ran out
          # as the field came in (#705).
          timeout: 60000
- runFlow:
    when:
      true: ${WINDOW == 'split-half'}
    commands:
      - repeat:
          while:
            notVisible:
              id: "sign-in-email"
          times: 25
          commands:
            - swipe:
                start: "40%, 60%"
                end: "40%, 30%"
                duration: 800
# iOS sometimes takes the typing before its keyboard is up: typed again until the field shows it (iOS shows a field's
# value to Maestro, Android does not). Tapped once, before, at its right end: at the largest text size the address is
# wider than the field, a tap on its middle put the caret there, and the next try's erasing, which deletes before the
# caret, left « .test » after it (« maestro…@e2e.jobbbox.test.test », iPhone SE, #705).
- tapOn:
    id: "sign-in-email"
    point: "95%, 50%"
- waitForAnimationToEnd:
    timeout: 3000
# Each try taps the field again while the address does not show in it: the first tap sometimes left it without the
# focus, every try's typing went nowhere and the field stayed empty (iPhone SE light, runs 42361117140 and 42382627575).
# Tapped at its right end, not its middle: the address, wider than the field on an iPhone SE, scrolls to its end as it
# is typed, and a tap on its middle put the caret within it; erasing, which deletes before the caret, left the rest,
# and each try added to it (« …jobbbox.test@… », run 42424659937, iphone-se light). The first try's check had come
# while iOS was still typing (« maestro…@e »): the address is waited for, a few seconds.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: ${STACK_EMAIL}
          commands:
            - tapOn:
                id: "sign-in-email"
                point: "95%, 50%"
            - waitForAnimationToEnd:
                timeout: 3000
      - eraseText: 100
      - inputText: ${STACK_EMAIL}
      - runFlow:
          when:
            platform: iOS
          commands:
            - extendedWaitUntil:
                visible: ${STACK_EMAIL}
                timeout: 5000
- runFlow:
    file: hide-keyboard.yaml
# iOS's email and number keyboards have no key that closes them, and Maestro takes a button the keyboard covers for one
# it can tap (its tap landed on the keyboard's « y »): the keyboard closed as a person closes it, by a tap beside the
# field, on its label (the field, named by it, comes after it).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Votre adresse e-mail"
          index: 0
      - runFlow: close-gate-keyboard.yaml
- runFlow:
    when:
      true: ${WINDOW != 'split-half'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Recevoir mon lien de connexion"
          direction: DOWN
- runFlow:
    when:
      true: ${WINDOW == 'split-half'}
    commands:
      - repeat:
          while:
            notVisible:
              text: "Recevoir mon lien de connexion"
          times: 25
          commands:
            - swipe:
                start: "40%, 60%"
                end: "40%, 30%"
                duration: 800
- tapOn: "Recevoir mon lien de connexion"
# The code's field, below the screen's fold at the largest text size on an iPhone SE (the explanation above it takes
# the screen): scrolled to while the email is sent.
- runFlow:
    when:
      true: ${WINDOW != 'split-half'}
    commands:
      - scrollUntilVisible:
          element:
            id: "sign-in-code"
          direction: DOWN
          timeout: 30000
- runFlow:
    when:
      true: ${WINDOW == 'split-half'}
    commands:
      - repeat:
          while:
            notVisible:
              id: "sign-in-code"
          times: 25
          commands:
            - swipe:
                start: "40%, 60%"
                end: "40%, 30%"
                duration: 800
- runScript: ../scripts/sign-in-code.js
# As the email: iOS took the code's first digit only, its keyboard not up yet for the others (« Ce code ne convient
# pas »). Typed again until the field shows it all.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "sign-in-code"
      - waitForAnimationToEnd:
          timeout: 3000
      - eraseText
      - inputText: ${output.signInCode}
      - runFlow:
          when:
            platform: iOS
          commands:
            - assertVisible: ${output.signInCode}
- runFlow:
    file: hide-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Saisir le code reçu par e-mail"
          index: 0
      - runFlow: close-gate-keyboard.yaml
# On four lines at the largest text size on an iPhone SE, taller than half the screen: scrolled to in short steps,
# whole, « Renvoyer le lien » under it.
- runFlow:
    file: gate-scroll.yaml
    env:
      TEXT: "Me connecter avec ce code"
      AFTER: "Renvoyer le lien"
- tapOn: "Me connecter avec ce code"
- extendedWaitUntil:
    visible: "Joindre un lien ou un document"
    timeout: 30000
