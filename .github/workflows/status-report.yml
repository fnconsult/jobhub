# Daily delivery status report (scripts/status-report.mjs), at 18:00 Paris time.
#
# GitHub's cron is UTC only, so both 16:00 and 17:00 UTC are scheduled and the run whose hour
# is not 18:00 in Europe/Paris skips itself: 16:00 UTC in summer (CEST), 17:00 UTC in winter (CET).
# Scheduled runs can start a few minutes late when GitHub is busy.
#
# The report is emailed to STATUS_REPORT_TO (default dev@jobbbox.ai) through Brevo's API, the
# provider the app sends with (ADR-0007), and posted as a comment on the issue labelled
# `status-report` (created on the first run). The run's summary and artifact hold it too.
# Run it by hand: `gh workflow run status-report.yml`.
#
# Settings → Secrets and variables → Actions:
#   secret    BREVO_API_KEY       a Brevo API key (xkeysib-…); without it the email step fails
#   variable  STATUS_REPORT_FROM  the sender, an address Brevo has verified (e.g. MAIL_FROM's)
#   variable  STATUS_REPORT_TO    optional, comma-separated recipients
# Privacy register: docs/privacy/register.md, « Delivery status report ».
name: Status report

on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: status-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  deployments: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Is it 18:00 in Paris?
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/Paris date +%z)   # +0200 in summer, +0100 in winter
          case "${{ github.event.schedule }}|$offset" in
            "0 16 * * *|+0200"|"0 17 * * *|+0100") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not 18:00 in Paris for this schedule ($offset), skipping."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - if: steps.when.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.when.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the report
        if: steps.when.outputs.run == 'true'
        run: |
          node scripts/status-report.mjs --out status-report.md
          cat status-report.md >> "$GITHUB_STEP_SUMMARY"

      - if: steps.when.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: status-report.md
          retention-days: 30

      - name: Post it on the status-report issue
        if: steps.when.outputs.run == 'true'
        run: |
          gh label create status-report --color 0E8A16 \
            --description "Daily delivery status report (status-report workflow)" 2>/dev/null || true
          issue=$(gh issue list --label status-report --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            url=$(gh issue create --label status-report --title "Rapport de livraison quotidien" --body \
              "Le workflow \`status-report\` publie ici chaque jour à 18:00 (heure de Paris) le rapport de \`scripts/status-report.mjs\`. Suivez cette issue pour le recevoir par notification et e-mail. Ne pas fermer : le workflow en recréerait une.")
            issue=${url##*/}
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Rapport du $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M') (Paris)"
            echo
            echo "[Exécution]($run_url)"
            echo
            cat status-report.md
          } > comment.md
          # A comment holds at most 65,536 characters; a longer report stays in the run's summary.
          if [ "$(wc -c < comment.md)" -gt 65000 ]; then
            printf '## Rapport du %s (Paris)\n\nTrop long pour un commentaire : voir le résumé de [l’exécution](%s).\n' \
              "$(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')" "$run_url" > comment.md
          fi
          gh issue comment "$issue" --body-file comment.md

      - name: Email it
        if: steps.when.outputs.run == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FROM: ${{ vars.STATUS_REPORT_FROM }}
          TO: ${{ vars.STATUS_REPORT_TO || 'dev@jobbbox.ai' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BREVO_API_KEY" ] || [ -z "$FROM" ]; then
            echo "::error::Set the BREVO_API_KEY secret and the STATUS_REPORT_FROM variable to email the report."
            exit 1
          fi
          node --input-type=module - <<'JS'
          import { readFileSync } from "node:fs";
          const md = readFileSync("status-report.md", "utf8");
          const day = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", dateStyle: "long" }).format(new Date());
          const escape = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const text = `${md}\n\nExécution : ${process.env.RUN_URL}\n`;
          const res = await fetch("https://api.brevo.com/v3/smtp/email", {
            method: "POST",
            headers: { "api-key": process.env.BREVO_API_KEY, "content-type": "application/json", accept: "application/json" },
            body: JSON.stringify({
              sender: { email: process.env.FROM, name: "Jobbbox status report" },
              to: process.env.TO.split(",").map((email) => ({ email: email.trim() })).filter((r) => r.email),
              subject: `Rapport de livraison du ${day}`,
              textContent: text,
              htmlContent: `<pre style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap">${escape(text)}</pre>`,
            }),
          });
          if (!res.ok) { console.error(`Brevo answered ${res.status}: ${await res.text()}`); process.exit(1); }
          console.log("Emailed to", process.env.TO);
          JS
