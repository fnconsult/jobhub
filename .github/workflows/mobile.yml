name: mobile

# The Jobbbox app's builds and updates on EAS (#704, ADR-0076; runbook: docs/ops/mobile.md). Manual: the product owner
# runs it. `build` builds iOS and Android with the profile of apps/mobile/eas.json and submits them: staging to
# TestFlight and Play internal testing (pointing at staging.jobbbox.ai), production to the stores (jobbbox.ai), only from
# a Version's tag vX.Y.Z, which only the Promotion pushes (ADR-0063). `update` publishes a JavaScript-only fix by EAS
# Update on the profile's channel: it reaches the builds with the same native code alone (runtime `fingerprint`).
# Beside each run, the stores' « Nouveautés » are written from the Version's Release Note (artifact, and the summary).
# Running it from the Promotion comes later. EAS's token is the repository secret EXPO_TOKEN; the store credentials stay
# on EAS (`eas credentials`).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS : staging (Beta, TestFlight, test interne Play) ou production (stores, depuis un tag vX.Y.Z)"
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: "build : builds natives et envoi aux stores ; update : correctif JavaScript seul par EAS Update"
        type: choice
        options: [build, update]
        default: build
      platform:
        description: "Plateformes (build seulement)"
        type: choice
        options: [all, ios, android]
        default: all
      message:
        description: "Message de la mise à jour (update seulement)"
        type: string
        default: ""

concurrency:
  group: mobile-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile }}
      ACTION: ${{ inputs.action }}
      PLATFORM: ${{ inputs.platform }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Check the run
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The repository secret EXPO_TOKEN is missing (docs/ops/mobile.md)"; exit 1
          fi
          if [ "$PROFILE" = production ] && ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::production is built or updated only from a Version's tag vX.Y.Z (ADR-0063), not $GITHUB_REF"; exit 1
          fi
          if [ "$ACTION" = update ] && [ -z "$MESSAGE" ]; then
            echo "::error::An update needs its message: what it fixes"; exit 1
          fi
      - uses: actions/checkout@v4
      # The stores' listings are drafts while a field waits for the publishing entity's name (#708, apps/mobile/store).
      - name: Refuse production while a listing waits for the publishing entity
        if: inputs.profile == 'production' && inputs.action == 'build'
        run: |
          if pending=$(grep -rlF '[ENTITÉ À CONFIRMER]' apps/mobile/store); then
            echo "::error::Fields still wait for the publishing entity (docs/ops/mobile.md « Fiches des stores et première soumission »): $(echo $pending)"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The stores' « Nouveautés » of the Version this build carries (the root package.json's), from its Release Note.
      - name: Write the stores' « Nouveautés »
        run: |
          npm run store-whats-new -w @jobhub/help -- "$RUNNER_TEMP/whatsnew"
          {
            echo "## Nouveautés des stores, $(node -p 'require("./package.json").version')"
            for file in "$RUNNER_TEMP"/whatsnew/*; do
              echo "### ${file##*/}"; echo '```'; cat "$file"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: whatsnew-${{ inputs.profile }}
          path: ${{ runner.temp }}/whatsnew
          if-no-files-found: error
          retention-days: 30
      - name: Build and submit
        if: inputs.action == 'build'
        working-directory: apps/mobile
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait --auto-submit-with-profile "$PROFILE"
      # EAS Update bundles the JavaScript here: it takes the profile's address from eas.json, as its builds do.
      - name: Publish the update
        if: inputs.action == 'update'
        working-directory: apps/mobile
        run: |
          # Off in the builds until a privacy policy version names Expo (ADR-0064, docs/ops/mobile.md): no build would take it.
          if [ "$(jq -r '.expo.updates.enabled' app.json)" = false ]; then
            echo "::error::EAS Update is off in app.json (updates.enabled): see docs/ops/mobile.md « EAS Update et la vie privée »"; exit 1
          fi
          EXPO_PUBLIC_WEB_APP_URL=$(jq -r --arg profile "$PROFILE" '.build[$profile].env.EXPO_PUBLIC_WEB_APP_URL' eas.json)
          export EXPO_PUBLIC_WEB_APP_URL
          eas update --channel "$PROFILE" --message "$MESSAGE" --non-interactive
