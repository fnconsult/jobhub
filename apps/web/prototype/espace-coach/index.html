/* barre du prototype (pour le product owner) */

<div id="root"></div>
<script>
// ───────────────────────────── Données de démonstration (fictives) ─────────────────────────────
const NOW = "ven. 6 nov. 2026, 9 h 52";

};

const MONTHS = {
  "2026-11": { label: "Novembre 2026", open: true, rows: { o1: 3, o2: 1, o3: 0 }, refunds: [], payout: "à verser le 5 déc. 2026" },
  "2026-10": { label: "Octobre 2026", rows: { o1: 11, o2: 4, o3: 2 }, refunds: [{ who: "Karim B.", what: "Séance découverte du 15 oct. (annulée par vous)", amount: 60, seller: "jobbbox" }], payout: "versé le 5 nov. 2026" },
  "2026-09": { label: "Septembre 2026", rows: { o1: 8, o2: 2, o3: 1 }, refunds: [], payout: "versé le 5 oct. 2026" },
};
const SCREENS = {
  aujourdhui: "Aujourd'hui", candidates: "Mes Candidates", candidate: "Fiche d'un Candidate", seances: "Mes séances", seance: "Une séance",
  disponibilites: "Disponibilités", profil: "Profil public", revenus: "Revenus", contrat: "Contrat", association: "Espace association", aide: "Aide",
};
const NAV = [
  ["aujourdhui", "Aujourd'hui", 3], ["candidates", "Mes Candidates"], ["seances", "Mes séances", 1], ["disponibilites", "Disponibilités"],
  ["profil", "Profil public"], ["revenus", "Revenus"], ["contrat", "Contrat", 1], ["aide", "Aide"],
];
const NAV_OF = { candidate: "candidates", seance: "seances" };

// ───────────────────────────── État et URL ─────────────────────────────
const S = { screen: "aujourdhui", variant: "A", theme: "light", density: "confort", cand: "c1", seance: "s1", phase: "avant", tab: "avenir", month: "2026-10",
  sel: "s1", contract: "v2", asso: "coachs", help: "h1", drawer: false, bell: false, cancel: 0, reason: "", offer: "creneau", slot: "", accepted: false, profileSent: true };
const PARAMS = ["screen", "variant", "theme", "density", "cand", "seance", "phase", "tab"];
const DEFAULTS = { screen: "aujourdhui", variant: "A", theme: "light", density: "confort", cand: "c1", seance: "s1", phase: "avant", tab: "avenir" };
function readUrl() {
  const q = new URLSearchParams(location.search);
  if (SCREENS[q.get("screen")]) S.screen = q.get("screen");
  if (q.get("variant") === "B") S.variant = "B";
  if (q.get("theme") === "dark") S.theme = "dark";
  if (q.get("density") === "compact") S.density = "compact";
  if (CANDS[q.get("cand")]) S.cand = q.get("cand");
  if (SESS[q.get("seance")]) S.seance = q.get("seance");
  if (["avant", "pendant", "apres"].includes(q.get("phase"))) S.phase = q.get("phase");
  if (["avenir", "planifier", "passees"].includes(q.get("tab"))) S.tab = q.get("tab");
}
function urlFor(patch = {}) {
  const st = { ...S, ...patch }, q = new URLSearchParams();
  for (const k of PARAMS) {
    if (st[k] === DEFAULTS[k]) continue;
    if ((k === "cand") && st.screen !== "candidate" && !(st.variant === "B" && st.screen === "candidates")) continue;
    if ((k === "seance" || k === "phase") && st.screen !== "seance" && !(st.variant === "B" && st.screen === "seances")) continue;
    if (k === "tab" && st.screen !== "seances") continue;
    q.set(k, st[k]);
  }
  const s = q.toString();
  return location.pathname + (s ? "?" + s : "");
}
function set(patch) { Object.assign(S, patch); history.replaceState(null, "", urlFor()); render(); }

// ───────────────────────────── Petits utilitaires ─────────────────────────────
const eur = (n) => n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const cname = (id) => `${CANDS[id].first} ${CANDS[id].ini}.`;
const offer = (id) => OFFERS.find((o) => o.id === id);
const go = (screen, extra = {}, label, cls = "") => `<a class="${cls}" href="${urlFor({ screen, ...extra })}" data-go='${JSON.stringify({ screen, ...extra })}'>${label}</a>`;
const sellerPill = (o) => o.seller === "coach" ? `<span class="pill acc">Vendue par vous</span>` : o.seller === "jobbbox" ? `<span class="pill">Vendue par Jobbbox</span>` : `<span class="pill">Vendue par l'association</span>`;
function joinArea(s, big = false) {

function sidebar() {

    <p class="grp">À faire</p><ul class="items">${todoItems.map(([id, t, s]) => `<li><button class="it" data-sel="${id}" ${S.sel === id ? 'aria-current="true"' : ""}><span class="t"><b>${t}</b><small>${s}</small></span></button></li>`).join("")}</ul>`;
  let detail;

function monthCalc(m) {
  const M = MONTHS[m]; let coachSales = 0, commission = 0, due = 0, held = 0;
  const lines = OFFERS.map((o) => {
    const n = M.rows[o.id]; held += n;
    if (o.seller === "coach") { const g = n * o.price, c = g * o.commission / 100; coachSales += g; commission += c; return { o, n, gross: g, comm: c, you: g - c }; }
    if (o.seller === "jobbbox") { const d = n * o.due; due += d; return { o, n, gross: null, comm: null, you: d }; }
    return { o, n, gross: null, comm: null, you: null };
  });
  const refunds = M.refunds.reduce((a, r) => a + (r.seller === "coach" ? r.amount : 0), 0);
  return { M, lines, held, coachSales, commission, due, refunds, payout: coachSales - commission - refunds + due };
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("a, button, input");

  const d = el.dataset;
  if (d.go) { e.preventDefault(); const p = JSON.parse(d.go); return set({ tab: S.tab, ...p, drawer: false, bell: false, phase: p.phase ?? (p.seance ? (SESS[p.seance].status === "passee" ? "apres" : "avant") : S.phase), sel: p.seance ?? S.sel, focus: "#content" }); }

  if (d.variant) return set({ variant: d.variant });

  if (d.pdens !== undefined) return set({ density: S.density === "compact" ? "confort" : "compact", focus: "[data-pdens]" });

  if (d.bell !== undefined) return set({ bell: !S.bell, focus: "[data-bell]" });

  if (d.tab) return set({ tab: d.tab, seance: d.tab === "planifier" ? "s5" : Object.keys(SESS).find((k) => SESS[k].status === (d.tab === "passees" ? "passee" : d.tab)), focus: `[data-tab="${d.tab}"]` });
  if (d.phase) return set({ phase: d.phase, focus: `[data-phase="${d.phase}"]` });

  if (d.contract) return set({ contract: d.contract });
  if (d.asso) { e.preventDefault(); return set({ asso: d.asso, drawer: false }); }
  if (d.help) return set({ help: d.help, helpOpen: true });
  if (d.cancel !== undefined) return set({ cancel: 1, reason: "", offer: "creneau", focus: "#h-cancel" });
  if (d.cclose !== undefined) return set({ cancel: 0, focus: "[data-cancel]" });
  if (d.cstep) { if (el.getAttribute("aria-disabled") === "true") return; return set({ cancel: +d.cstep, focus: "#h-cancel" }); }
  if (d.reason !== undefined) return set({ reason: el.value, focus: `input[value="${el.value}"]` });
  if (d.offer) return set({ offer: d.offer, focus: `[data-offer="${d.offer}"]` });
  if (d.sendProfile !== undefined) return set({ profileSent: true });
  if (d.accept !== undefined) { if (!document.getElementById("acc").checked) { document.getElementById("acc").focus(); return; } return set({ accepted: true }); }
});
document.addEventListener("change", (e) => {
  if (e.target.matches("[data-pscreen]")) set({ screen: e.target.value, drawer: false, bell: false, cancel: 0, focus: "#p-screen" });
  if (e.target.matches("[data-month]")) set({ month: e.target.value, focus: "#month-a" });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.cancel) return set({ cancel: 0, focus: "[data-cancel]" }); if (S.bell) return set({ bell: false, focus: "[data-bell]" }); if (S.drawer) return set({ drawer: false, focus: ".menu-btn" }); }
  const tab = e.target.closest('[role="tab"]');
  if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const tabs = [...tab.parentElement.querySelectorAll('[role="tab"]')], i = tabs.indexOf(tab);
    tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length].click();
  }
});

readUrl(); history.replaceState(null, "", urlFor()); render();
