# Scrolls the open pane until TEXT shows, starting UP or DOWN (DIRECTION): the Fiche's or the Work Pane's column at the
# window's right on a tablet (LAYOUT columns), the pane over the whole window otherwise, an iPad's Split View then the
# left half only. Maestro's scrollUntilVisible swipes the middle of the screen, which on a tablet is the conversation:
# the pane never moved. Within the pane: below the top of its body.
# In short, slow steps (15 % of the screen's height, 800 ms, no fling): Maestro's scrollUntilVisible swipes from the
# screen's middle by some 40 % of its height, past what a folded foldable shows at the largest text size. DIRECTION
# first, then back the other way, should the element have come in where the steps had already been (a card still
# loading). Then pulled within the column: iOS gives Maestro an element's whole frame, the part the column clips
# included, and an iPhone SE's tap on a card under the Top Bar hit the page's title.
appId: ai.jobbbox.app
---
- evalScript: "${output.paneX = LAYOUT == 'columns' ? 88 : 40}"
- runFlow:
    when:
      true: ${DIRECTION == 'UP'}
    commands:
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
          times: 25
          commands:
            - swipe:
                start: "${output.paneX}%, 30%"
                end: "${output.paneX}%, 45%"
                duration: 800
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
          times: 25
          commands:
            - swipe:
                start: "${output.paneX}%, 45%"
                end: "${output.paneX}%, 30%"
                duration: 800
- runFlow:
    when:
      true: ${DIRECTION == 'DOWN'}
    commands:
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
          times: 25
          commands:
            - swipe:
                start: "${output.paneX}%, 45%"
                end: "${output.paneX}%, 30%"
                duration: 800
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
          times: 25
          commands:
            - swipe:
                start: "${output.paneX}%, 30%"
                end: "${output.paneX}%, 45%"
                duration: 800
- repeat:
    while:
      notVisible:
        text: ${TEXT}
        below:
          id: "pane-body"
    times: 3
    commands:
      - swipe:
          start: "${output.paneX}%, 30%"
          end: "${output.paneX}%, 45%"
          duration: 800
- assertVisible:
    text: ${TEXT}
