# Before each run (run.ts): the app as installed, its data and its Keychain cleared, in the run's orientation. The
# run's Candidate signs in later, by their code.
appId: ai.jobbbox.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: system-alerts.yaml
- runFlow:
    when:
      true: ${ORIENTATION != ''}
    commands:
      - setOrientation: ${ORIENTATION}
