# The `edge` container of deploy/compose.yml (ADR-0094): Jobbbox's own error page wherever the VPS's Traefik would
# otherwise answer with its bare text (`404 page not found`, `Bad Gateway`, `Gateway Timeout`).
#
# - Its router takes the environment's host at the lowest priority: it answers only while no web container is routed
#   (stopped, starting or unhealthy: during a deploy or after a crash). Every request then gets a 503 with
#   `Retry-After`: the page, its URL's language first (English under /en or with ?lang=en), or JSON under /api.
# - The web router's `errors` middleware asks /__edge/502 or /__edge/504 when the routed container does not answer;
#   Traefik keeps the status and takes the page.
# The pages are generated (apps/web/src/edge/pages.ts, `npm run edge-pages -w @jobhub/web`). No access log: the
# container keeps no address or path of anyone.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  access_log off;
  server_tokens off;
  charset utf-8;
  default_type text/html;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $request_uri $edge_locale {
    ~^/en(/|\?|#|$) en;
    ~[?&]lang=en(&|#|$) en;
    default fr;
  }

  server {
    listen 8080 default_server;
    root /etc/jobbbox-edge/pages;

    # The web router's errors middleware (deploy/compose.yml). The original request's address is not passed on: French first.
    location ~ ^/__edge/(502|504)$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      try_files /$1.fr.html =404;
    }

    location ~ ^/api(/|$) {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      add_header Retry-After "30" always;
      return 503 '{"error":"unavailable"}\n';
    }

    location / {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      add_header Retry-After "30" always;
      error_page 503 /503.$edge_locale.html;
      return 503;
    }

    location ~ ^/503\.(fr|en)\.html$ {
      internal;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      add_header Retry-After "30" always;
    }
  }
}
