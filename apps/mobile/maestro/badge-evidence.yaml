appId: ai.jobbbox.app
name: Evidence du badge actif à la taille de texte par défaut
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/menu.yaml
    env:
      MENU: "Recherches d'offres(, .+)?"
- extendedWaitUntil:
    visible: "Recherches d'offres, ${BADGE_COUNT} .+ à traiter"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: record/${CAPTURE_DIR}/badge-${BADGE_COUNT}
