; STARTTLS for whoever asks (opportunistic, as MX servers do): never required, no client certificate asked.
; docker-entrypoint.sh writes a self-signed certificate here unless one is mounted (deploy/mta/compose.yml).
[main]
key=/run/haraka-tls/key.pem
cert=/run/haraka-tls/cert.pem
dhparam=/run/haraka-tls/dhparams.pem
requestCert=false
rejectUnauthorized=false

[no_tls_hosts]

[mutual_auth_hosts]

[mutual_auth_hosts_exclude]

[outbound]
