# iPad Split View, half and half (#705): no simctl or Maestro command sets it, so the flow does what a person does, in
# iPadOS 18's own screens: the multitasking button at the top of a window, « Split View », then the other app for the
# other half. The iPad's job runs iPadOS 18 (mobile-e2e.yml): iPadOS 26 has windows instead, and no such button. These
# are the system's labels, in French or English as the simulator speaks (flows.test.ts leaves them out of its check of
# the app's labels). To confirm on the first CI run of each new Xcode: docs/ops/mobile.md.
# Maestro's iOS driver reads the app in front and the status bars only, not the rest of SpringBoard: the multitasking
# button and its menu are never in its hierarchy (« Element not found » on every run on iPadOS 18.6). They are tapped
# where iPadOS draws them, as a person does: the button (•••) at the window's top centre, then « Split View », the
# second of the menu's rows under it (« Plein écran », « Split View », « Slide Over », « Fermer », 44 pt each, as run
# 42323647801's split-view-2-menu.png shows them, « Split View » some 90 pt from the top of the landscape screen, the
# first row taken at 3 %). Each step's screen is kept with the run's results (split-view-*.png).
# Safari is split first and the app opened beside it, on the right half: Maestro places the app's elements on the
# right half whichever half it has, and with the app split first, on the left, its taps went to Safari (run
# 42424659937: ipad-split-half-light typed the sign-in address in Safari's address bar). Opened last, the app is also
# the one Maestro reads, and has the focus.
appId: ai.jobbbox.app
---
# Tried again until the app has its half, read from its own frame (gate-screen, the sign-in page, 683 pt wide in Split
# View, 1376 on the whole screen): run 42413471132 tapped the multitasking button before iPadOS showed it, no menu
# opened (ipad-split-half-dark, split-view-2-menu.png).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          appId: "com.apple.mobilesafari"
          stopApp: false
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: split-view-1-before
      - tapOn:
          point: "50%, 1%"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: split-view-2-menu
      - tapOn:
          point: "50%, 9%"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: split-view-3-other-app
      # iPadOS waits for the other half's app, on its Home Screen, whose icons Maestro does not see: the app opened.
      - launchApp:
          appId: "ai.jobbbox.app"
          stopApp: false
      - extendedWaitUntil:
          visible: "(Menu|Se connecter à Jobbbox)"
          timeout: 20000
      - assertVisible:
          id: "gate-screen"
          width: 683
          tolerance: 20
- takeScreenshot: split-view-4-split
