/* sessions list */
.sess { display: flex; gap: .75rem; align-items: center; padding: .75rem 1rem; border-top: 1px solid var(--color-border); flex-wrap: wrap; }
.sess:first-of-type { border-top: 0; }
.sess .what { flex: 1 1 14rem; min-width: 0; }
.sess .what small { display: block; color: var(--color-meta); }

/* Action Cards */
.acard { border: 1px solid var(--color-border); border-radius: 10px; padding: .75rem .9rem; background: var(--color-background); display: flex; flex-direction: column; gap: .4rem; }
.acard .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--color-meta); }
.acard.done { background: var(--color-success-soft); border-color: transparent; }
.report h3 { font-size: .9rem; margin: .8rem 0 .2rem; }
.report ul { margin: .2rem 0; padding-left: 1.2rem; }

/* rappels */
.mocks { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
.mail { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; background: var(--color-background); }
.mail .mh { padding: .7rem 1rem; border-bottom: 1px solid var(--color-border); font-size: .8125rem; background: var(--color-surface); }
.mail .mh div { padding: .1rem 0; }
.mail .mb { padding: 1rem 1.25rem; }
.phone { max-width: 20rem; margin: 0 auto; width: 100%; border-radius: 2rem; border: 8px solid var(--color-inverse); background: linear-gradient(180deg, #2b2f55, #121219); color: #fff; padding: 2.25rem .9rem 2rem; }
.phone .clock { text-align: center; font-size: 2.5rem; font-weight: 300; }
.phone .date { text-align: center; font-size: .85rem; opacity: .9; margin-bottom: 1rem; }
.push { background: rgb(255 255 255 / 92%); color: #1b1b26; border-radius: 14px; padding: .65rem .8rem; font-size: .82rem; margin-bottom: .5rem; }
.push .ph { display: flex; gap: .4rem; align-items: center; font-size: .72rem; color: #555; margin-bottom: .2rem; }
.push .ph i { width: 1rem; height: 1rem; border-radius: 4px; background: #4f5fe0; color: #fff; font-style: normal; font-size: .6rem; display: grid; place-items: center; }
.push .act { display: inline-block; margin-top: .4rem; background: #4f5fe0; color: #fff; border-radius: 999px; padding: .2rem .7rem; font-weight: 500; border: 0; }

/* phase suivante */
.phase { border: 2px dashed var(--color-warn); background: var(--color-warn-soft); border-radius: 12px; padding: .75rem 1rem; }
.phase b { color: var(--color-warn); }
.rec { display: inline-flex; align-items: center; gap: .45rem; background: var(--color-danger-soft); color: var(--color-danger); border-radius: 999px; padding: .25rem .75rem; font-weight: 600; font-size: .85rem; }
.rec::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } }
.consent { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.consent .who-c { border: 1px solid var(--color-border); border-radius: 10px; padding: .75rem; }
.ai-label { display: inline-flex; gap: .35rem; align-items: center; font-size: .75rem; color: var(--color-accent); background: var(--color-accent-soft); border-radius: 999px; padding: .1rem .55rem; font-weight: 500; }

/* barre du prototype (PO) */
.proto { position: fixed; bottom: .5rem; right: .5rem; z-index: 100; display: flex; align-items: center; gap: .4rem; background: #111; color: #fff; border-radius: 999px; padding: .3rem .45rem; font-size: .78rem; box-shadow: 0 6px 20px rgb(0 0 0 / 35%); font-family: ui-monospace, monospace; max-width: calc(100vw - 1rem); flex-wrap: wrap; }
.proto button { background: #2a2a2a; border: 0; color: #fff; border-radius: 999px; padding: .25rem .6rem; font: inherit; }
.proto button[aria-pressed="true"] { background: #fff; color: #111; }
.proto select { background: #2a2a2a; color: #fff; border: 0; border-radius: 999px; padding: .25rem .5rem; width: auto; font: inherit; }
.proto :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.proto .lbl { padding: 0 .3rem; white-space: nowrap; color: #ddd; }
.proto .sep { width: 1px; height: 1rem; background: #555; }

/* iPad */
@media (max-width: 1180px) {
  .sb { width: 14rem; }
  .col-pane { width: 19rem; }
  .grid2 { grid-template-columns: minmax(0, 1fr) 17rem; }
  .cal .calin { grid-template-columns: minmax(0, 1fr) 11rem; }
}
@media (max-width: 960px) {
  .grid2, .mocks { grid-template-columns: minmax(0, 1fr); }
}

/* téléphone */
.scrim { display: none; }
@media (max-width: 767px) {
  .sb { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; width: 85vw; visibility: hidden; }
  .app.drawer .sb { transform: none; visibility: visible; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: var(--color-scrim); z-index: 30; }
  .menu-btn { display: inline-flex; }
  .top .hide-phone { display: none; }
  .convo { min-width: 0; }
  .thread { padding: 1rem .75rem 4rem; }
  .page { padding: 1rem .75rem 5rem; }
  .col-pane, .docp { display: none; }
  .app.pane-open .col-pane, .app.pane-open .docp { display: flex; position: fixed; inset: 0; width: auto; z-index: 50; background: var(--color-canvas); padding: .75rem; }
  .app.pane-open .col-pane > .cbody { padding: 0; }
  .phone-close, .hide-desk { display: inline-flex; }
  .msg.me { max-width: 90%; }
  .cal .calin { grid-template-columns: minmax(0, 1fr); }
  .consent { grid-template-columns: 1fr; }
  .page-doc { padding: 1rem; }
  .proto { left: auto; right: .5rem; bottom: .5rem; flex-wrap: nowrap; gap: .25rem; }
  .proto select { max-width: 8.5rem; }
  .proto .sep { display: none; }
  .composer { padding-bottom: 3.25rem !important; }
}
</style>
</head>
<body>
<a class="vh" href="#contenu">Aller au contenu</a>
<div id="root"></div>
<script>
// ───────────────────────────── Données fictives ─────────────────────────────
const CAND = { first: "Sophie", last: "Lambert", short: "Sophie L.", city: "Montréal" };
const COACHES = [
  { id: "claire", name: "Claire Martin", ini: "CM", title: "Coach carrière, ex-DRH industrie", spec: ["Reconversion après 45 ans", "Entretiens de direction", "Négociation"], lang: ["Français", "Anglais"], tz: "Paris", price: 90, vat: 15, seller: "coach", sellerName: "Claire Martin", tool: "Zoom",
    bio: "Vingt ans de recrutement de cadres dirigeants dans l'industrie. J'aide les dirigeantes et dirigeants de plus de 45 ans à raconter leur parcours et à préparer leurs entretiens." },
  { id: "karim", name: "Karim Benali", ini: "KB", title: "Coach certifié, finance et opérations", spec: ["CV et LinkedIn", "Postes de DAF", "Pitch de 2 minutes"], lang: ["Français", "Arabe"], tz: "Paris", price: 75, vat: 12.5, seller: "jobbbox", sellerName: "Jobbbox", tool: "Google Meet",
    bio: "Ancien DAF de PME. Je travaille surtout le CV, le pitch et la préparation aux entretiens de finance." },
  { id: "helene", name: "Hélène Roux", ini: "HR", title: "Bénévole, ex-cadre RH", spec: ["Reprise d'emploi", "Confiance en entretien"], lang: ["Français", "Portugais"], tz: "Lisbonne", price: 40, vat: 0, seller: "asso", sellerName: "l'association Rebond 45+", tool: "Microsoft Teams",
    bio: "Bénévole de Rebond 45+, j'accompagne les personnes qui reprennent un emploi après une longue pause." },
];
const SELLER_LABEL = { jobbbox: "Vendu par Jobbbox", coach: "Vendu par le coach", asso: "Vendu par l'association" };
const TZ = { mtl: { label: "Montréal (UTC−5)", off: -6 }, par: { label: "Paris (UTC+1)", off: 0 }, lis: { label: "Lisbonne (UTC+0)", off: -1 } };
const SLOT_DAYS = [ { d: 10, n: "mar. 10 nov." }, { d: 12, n: "jeu. 12 nov." }, { d: 13, n: "ven. 13 nov." }, { d: 17, n: "mar. 17 nov." } ];
const SLOTS = [600, 690, 840, 900, 990]; // minutes, heure de Paris
const SESSION = { day: "jeudi 12 novembre 2026", dayShort: "jeu. 12 nov.", paris: 900, dur: 60 };

const SCREENS = {
  "choisir": "Choisir un coach", "commande": "Commande", "creneau": "Créneau (Cal.com)", "attente": "À planifier",
  "rappel": "Rappel", "seance-candidat": "Séance · Candidate", "seance-coach": "Séance · coach", "apres": "Après : compte rendu",
  "annulation": "Annulation", "phase-suivante": "Phase suivante",
};
const ROLE_SCREENS = ["rappel", "apres", "annulation", "phase-suivante"];

const S = {
  screen: "choisir", role: "candidat", theme: "light", tz: "mtl",
  coach: "claire", drawer: false, paneOpen: false,
  cgv: false, ipr: false, paid: false, tried: false,
  day: 12, slot: null, booked: false,
  soon: "ouvert",            // séance : "avant" (plus de 10 min) | "ouvert"
  shared: "tailored",        // document consulté ensemble : null | "tailored" | "cv"
  ctab: "doc",               // côté coach : "doc" | "slides"
  slide: 1, slidesUp: true,
  notes: "Très claire sur le périmètre opérations. À creuser : chiffres de la réorganisation logistique (2021) — elle les minimise.\nPeur de l'objection « surqualifiée ».",
  cards: {}, reportSent: false,
  cancelChoice: "autre", late: false, cancelDone: false, coachReason: "", coachCancelled: false, coachTried: false,
  consentC: true, consentK: false, recording: false, summaryOk: false,
};

// ───────────────────────────── URL ↔ état ─────────────────────────────
function readUrl() {
  const q = new URLSearchParams(location.search);
  if (SCREENS[q.get("screen")]) S.screen = q.get("screen");
  if (["candidat", "coach"].includes(q.get("role"))) S.role = q.get("role");
  if (TZ[q.get("tz")]) S.tz = q.get("tz");
  S.theme = q.get("theme") === "dark" ? "dark" : "light";
}
function writeUrl() {
  const q = new URLSearchParams({ screen: S.screen });
  if (ROLE_SCREENS.includes(S.screen)) q.set("role", S.role);
  if (S.tz !== "mtl") q.set("tz", S.tz);
  if (S.theme === "dark") q.set("theme", "dark");
  try { history.replaceState(null, "", "?" + q); } catch {}
}
const set = (patch) => { Object.assign(S, patch); writeUrl(); render(); };
const coach = () => COACHES.find((c) => c.id === S.coach) ?? COACHES[0];
const h = String.raw;
const eur = (n) => n.toFixed(2).replace(".", ",") + " €";
const pad = (n) => String(n).padStart(2, "0");
const hm = (min) => { const m = ((min % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
// Heure dans le fuseau du Candidate, avec l'heure de Paris rappelée quand elle diffère (#853, point 7).
const local = (parisMin) => hm(parisMin + TZ[S.tz].off * 60);
const at = (parisMin) => S.tz === "par" ? `<time>${local(parisMin)}</time>` : `<time>${local(parisMin)}</time> <span class="meta">(${hm(parisMin)} à Paris)</span>`;
const atText = (parisMin) => S.tz === "par" ? local(parisMin) : `${local(parisMin)} (${hm(parisMin)} à Paris)`;
const tzCity = () => TZ[S.tz].label.split(" ")[0];
const isCoachView = () => S.screen === "seance-coach" || (ROLE_SCREENS.includes(S.screen) && S.role === "coach");

// ───────────────────────────── Coquilles ─────────────────────────────
function sidebarCandidate() {
  const sessOn = ["seance-candidat", "apres", "annulation", "phase-suivante"].includes(S.screen);
  return h`<nav class="sb" aria-label="Navigation principale">
    <div class="brand"><i aria-hidden="true">J</i>Jobbbox</div>
    <div class="profile">Directrice des opérations <span aria-hidden="true">⌄</span></div>
    <button class="new">✎ Nouvelle conversation</button>
    <button class="nav">◎ Coach</button>
    <button class="nav">▤ Mes candidatures</button>
    <button class="nav">▦ Agenda</button>
    <button class="nav">⌕ Recherches d'offres</button>
    <button class="nav">✉ Job Digests</button>
    <button class="nav ${sessOn ? "" : "on"}" data-go="choisir" ${sessOn ? "" : 'aria-current="page"'}>☺ Mes coachs humains <span class="chev" aria-hidden="true">▾</span></button>
    <div class="sub">
      <button class="nav ${sessOn ? "on" : ""}" data-go="seance-candidat" ${sessOn ? 'aria-current="page"' : ""}>Séance du 12 nov. · Claire M.</button>
      <button class="nav" data-go="apres">Séance du 22 oct. · Claire M.</button>
    </div>
    <div class="foot">
      <button class="nav">⚙ Mon compte</button>
      <button class="nav">⇥ Se déconnecter</button>
    </div>
  </nav>`;
}
function sidebarCoach() {
  const items = ["Aujourd'hui", "Mes Candidates", "Mes séances", "Disponibilités", "Profil public", "Revenus", "Contrat", "Aide"];
  return h`<nav class="sb" aria-label="Espace coach">
    <div class="brand"><i aria-hidden="true">J</i>Jobbbox <small>· Espace coach</small></div>
    <div class="profile">Claire Martin <span class="meta xs">Paris</span></div>
    ${items.map((t) => `<button class="nav ${t === "Mes séances" ? "on" : ""}" ${t === "Mes séances" ? 'aria-current="page"' : ""}>${t}${t === "Mes séances" ? '<span class="count">2</span>' : ""}</button>`).join("")}
    <div class="foot"><button class="nav">⇥ Se déconnecter</button></div>

}
function topbar(title, extra = "") {
  return h`<header class="top">

}
const aiMsg = (html, prov = "prototype · aucun appel IA") => `<div class="msg"><span class="who ai">✦ Coach IA</span>${html}<div class="prov">${prov}</div></div>`;

    </div></div>
  </form>`;
}

// ───────────────────────────── Écrans ─────────────────────────────
function coachCard(c) {
  return h`<article class="card coach ${S.coach === c.id ? "on" : ""}" aria-labelledby="c-${c.id}">

function profilePane() {

  return h`<aside class="col-pane" aria-label="Profil public de ${c.name}"><div class="cbody">

function scrChoisir() {
  const body = h`<div class="body"><section class="convo" aria-label="Conversation Mes coachs humains">
    <div class="thread" id="contenu" tabindex="-1"><div class="col">
      ${aiMsg("<p>Je suis le Coach IA de Jobbbox, une IA et non une personne. Ici, vous retrouvez vos séances avec des Human Coaches, des personnes, et vous pouvez en réserver une.</p>", "Introduction · message fixe")}

function scrCommande() {
  const c = coach();
  const ht = c.price - c.vat;
  const ready = S.cgv && S.ipr;
  const err = S.tried && !ready;
  const body = h`<main class="page" id="contenu" tabindex="-1"><div class="wrap"><div class="grid2">
    <div class="stack">
      <section class="card" aria-labelledby="h-order">

          `<p class="small">Cette séance est vendue par <b>${c.sellerName}</b>, ${c.seller === "asso" ? "association" : "coach professionnelle"}, au prix qu'${c.seller === "asso" ? "elle" : "elle"} fixe. Jobbbox est la place de marché qui vous met en relation et encaisse le paiement pour son compte.</p>
           <p class="small meta">Vendeur : ${c.sellerName} · SIRET 000 000 000 00000 (démo) · médiateur du vendeur : Médiateur de la consommation (démo).</p>`}
      </section>
      <section class="card stack" aria-labelledby="h-cgv" style="gap:.75rem">

        <div class="legal" tabindex="0" aria-label="Extrait des conditions générales de vente">

          <p>1. La séance dure 60 minutes, à distance, par le lien donné par le coach (Zoom, Meet, Teams) ou par téléphone.</p>
          <p>2. Vous choisissez votre créneau après le paiement ; aucun créneau n'est réservé pendant le paiement. Une séance payée sans créneau reste « À planifier ».</p>
          <p>3. Vous pouvez reporter ou annuler jusqu'à 24 h avant la séance, et être remboursé. Après, la séance est due.</p>
          <p>4. Si le coach annule, vous êtes remboursé, ou vous choisissez un autre créneau ou un confrère.</p>
          <p>5. Le coach n'enregistre pas la séance et n'utilise pas de prise de notes par IA sans votre accord.</p>
        </div>
        <a href="#" class="small" data-noop>Télécharger les CGV (PDF)</a>

    ? `<div class="acard done" role="status"><span class="k">${kind}</span><b>${title}</b><span class="small">Fait. <a href="#" data-noop>Ouvrir</a></span></div>`
    : S.cards[k] === "no" ? `<div class="acard"><span class="k">${kind}</span><span class="small meta">Ignorée : ${title}</span></div>`
    : `<div class="acard"><span class="k">${kind}</span><b>${title}</b><span class="small meta">${sub}</span><div class="row"><button class="btn sm primary" data-card="${k}:ok">${kind === "Créer une Application" ? "Créer" : "Ajouter"}</button><button class="btn sm" data-card="${k}:no">Ignorer</button></div></div>`;
  const body = h`<div class="body"><section class="convo" aria-label="Coach Conversation de la séance">
    <div class="thread" id="contenu" tabindex="-1"><div class="col">
      <section class="card" aria-labelledby="h-done"><div class="row"><div class="av sm" aria-hidden="true">CM</div><div style="flex:1;min-width:0"><h2 id="h-done" style="font-size:1rem;margin:0">Séance avec Claire Martin</h2><div class="small meta">${SESSION.day} · ${atText(SESSION.paris)} · 60 min</div></div><span class="pill">Passée</span></div></section>
      <div class="day">Aujourd'hui, ${atText(SESSION.paris + 90)}</div>
      ${humanMsg("Claire Martin", h`<div class="report"><p><b>Compte rendu de séance</b></p>
        <h3>Ce qu'on a vu</h3><p>Le pitch de 2 minutes, l'objection « surqualifiée », la ligne du CV sur la réorganisation logistique.</p>
        <h3>Prochaines étapes</h3><ul><li>Postuler chez Ledger (Head of Finance) avant le 20 nov.</li><li>Préparer l'entretien Decathlon du mar. 18 nov. avec les 3 chiffres.</li></ul>
        <h3>Ressources</h3><ul><li><a href="#" data-noop>pitch-sophie.pdf</a> (slides de la séance)</li><li>Fiche « Répondre à l'objection surqualifiée »</li></ul></div>`, "Compte rendu publié par Claire · dans votre Data export")}
      ${aiMsg(h`<p>Claire propose deux prochaines étapes. Je peux les ajouter pour vous :</p>
        <div class="stack" style="gap:.5rem;margin-top:.5rem">
          ${card("app", "Créer une Application", "Ledger · Head of Finance", "Dans Mes candidatures, statut « À postuler »")}
          ${card("itw", "Ajouter un Interview", "Decathlon · mar. 18 nov. · " + atText(1020), "Dans la candidature Decathlon et l'Agenda")}
        </div>`)}
    </div></div>
    ${composer()}
  </section></div>`;
  return { shell: "cand", title: `<span class="crumb hide-phone">Mes coachs humains › </span>Séance du 12 nov. · compte rendu`, body };
}

function scrAnnulation() {
  if (S.role === "coach") {
    const err = S.coachTried && !S.coachReason.trim();
    const body = h`<main class="page" id="contenu" tabindex="-1"><div class="wrap narrow stack">
      <section class="card stack" aria-labelledby="h-cc" style="gap:.75rem">
        <h2 id="h-cc" style="margin:0">Annuler la séance avec Sophie L. ?</h2>
        <p class="small" style="margin:0">${SESSION.day} · 15:00 (Paris). Vous pouvez annuler à tout moment.</p>
        ${S.coachCancelled ? `<div class="note ok" role="status"><b>Séance annulée.</b> Sophie est prévenue par e-mail et Push notification. Elle choisit : remboursement, autre créneau avec vous, ou un confrère. La réservation Cal.com est annulée.</div>` : h`
        <label class="field"><span>Raison (Sophie la verra)</span><textarea data-reason rows="3" aria-invalid="${err}" aria-describedby="r-help ${err ? "r-err" : ""}">${S.coachReason}</textarea></label>
        <p id="r-help" class="xs meta" style="margin:0">Obligatoire.</p>
        ${err ? `<p id="r-err" class="small" style="color:var(--color-danger);margin:0">Indiquez une raison pour annuler.</p>` : ""}
        <div class="note"><b>Ce que Sophie se verra proposer :</b> le remboursement de ${eur(90)} dans Jobbbox, un autre créneau avec vous, ou une séance avec un confrère.</div>
        <div class="row"><button class="btn danger" data-coach-confirm>Annuler la séance</button><button class="btn" data-go="seance-coach">Garder la séance</button></div>`}
      </section>
    </div></main>`;
    return { shell: "coach", title: `<span class="crumb hide-phone">Mes séances › </span>Annuler`, body };
  }
  const opt = (v, t, d) => `<label class="choice"><input type="radio" name="cc" value="${v}" data-cancel-choice ${S.cancelChoice === v ? "checked" : ""}><span><b>${t}</b><span class="small meta">${d}</span></span></label>`;
  const body = h`<main class="page" id="contenu" tabindex="-1"><div class="wrap narrow stack">
    <section class="card stack" aria-labelledby="h-kc" style="gap:.75rem">
      <div class="note danger" role="status"><b>Claire Martin a annulé la séance du ${SESSION.dayShort} à ${atText(SESSION.paris)}.</b> Sa raison : « Un empêchement familial, je suis désolée. »</div>
      <h2 id="h-kc" style="margin:0">Que préférez-vous ?</h2>
      ${S.cancelDone ? `<div class="note ok" role="status"><b>${S.cancelChoice === "rembourse" ? "Remboursement lancé : 90,00 € sur votre carte, sous 5 à 10 jours." : S.cancelChoice === "autre" ? "Choisissez votre nouveau créneau avec Claire." : "Choisissez votre confrère : la séance reste payée."}</b></div>
        ${S.cancelChoice === "rembourse" ? "" : `<button class="btn primary" data-go="creneau">Ouvrir le calendrier</button>`}` : h`
      <fieldset><legend class="vh">Votre choix</legend>
        ${opt("autre", "Un autre créneau avec Claire", "Votre séance reste payée ; vous choisissez une nouvelle date dans son calendrier.")}
        ${opt("confrere", "Une séance avec un confrère", "Karim Benali ou Hélène Roux, au même prix ou moins, sans repayer.")}
        ${opt("rembourse", "Être remboursé·e", "90,00 € TTC remboursés dans Jobbbox, sur votre carte.")}
      </fieldset>
      <div class="row"><button class="btn primary" data-cancel-ok>Valider mon choix</button></div>`}
    </section>
    <section class="card stack" aria-labelledby="h-me" style="gap:.6rem">
      <h2 id="h-me" style="margin:0;font-size:1.05rem">Et si c'est vous qui annulez ?</h2>
      <div class="tabs" role="tablist" aria-label="Moment de l'annulation (démo)"><button role="tab" aria-selected="${!S.late}" data-late="0">Plus de 24 h avant</button><button role="tab" aria-selected="${S.late}" data-late="1">Moins de 24 h avant</button></div>
      <div role="tabpanel">${S.late
        ? `<div class="note warn"><b>La séance est due.</b> Il reste moins de 24 h avant votre séance, le ${SESSION.dayShort} à ${atText(SESSION.paris)} : vous ne pouvez plus la reporter ni l'annuler avec remboursement. Vous pouvez écrire à Claire.</div><div class="row" style="margin-top:.6rem"><button class="btn" aria-disabled="true">Reporter</button><button class="btn" aria-disabled="true">Annuler</button><button class="btn">Écrire à Claire</button></div>`
        : `<p class="small" style="margin:0">Vous pouvez reporter ou annuler jusqu'au ${"mer. 11 nov."} à ${atText(SESSION.paris)}. Annuler vous rembourse ${eur(90)} ; la réservation chez Cal.com est annulée aussi.</p><div class="row" style="margin-top:.6rem"><button class="btn" data-go="creneau">Reporter</button><button class="btn danger">Annuler et être remboursé·e</button></div>`}</div>
    </section>
  </div></main>`;
  return { shell: "cand", title: `<span class="crumb hide-phone">Mes coachs humains › </span>Séance annulée`, body };
}

function scrPhase() {
  const coachSide = S.role === "coach";
  const both = S.consentC && S.consentK;
  const body = h`<main class="page" id="contenu" tabindex="-1"><div class="wrap stack">
    <div class="phase" role="note"><b>Phase suivante — pas dans la v0.</b> Règles fixées par #855 : enregistrement jamais par défaut, consentement des deux participants à chaque séance, témoin visible, arrêt à tout moment, AIPD avant l'ouverture. Consultable sur le web seulement, jamais dans la Jobbbox app.</div>
    <div class="grid2">
      <section class="card stack" aria-labelledby="h-rec" style="gap:.75rem">
        <div class="row"><h2 id="h-rec" style="margin:0;font-size:1.05rem">Enregistrer cette séance ?</h2><span class="sp"></span>${S.recording ? `<span class="rec" role="status">Enregistrement en cours</span>` : `<span class="pill">Pas d'enregistrement</span>`}</div>
        <p class="small" style="margin:0">L'enregistrement sert seulement à la transcription et au résumé de la séance. Les deux participants doivent dire oui, à chaque séance.</p>
        <div class="consent">
          <div class="who-c"><b>Sophie L.</b> ${coachSide ? "" : "(vous)"}<br>
            ${coachSide ? (S.consentC ? `<span class="pill ok">A accepté</span>` : `<span class="pill">En attente</span>`) : `<label class="check" style="margin-top:.4rem"><input type="checkbox" data-consent="C" ${S.consentC ? "checked" : ""}> <span>J'accepte l'enregistrement de cette séance</span></label>`}</div>
          <div class="who-c"><b>Claire Martin</b> ${coachSide ? "(vous)" : ""}<br>
            ${!coachSide ? (S.consentK ? `<span class="pill ok">A accepté</span>` : `<span class="pill">En attente</span>`) : `<label class="check" style="margin-top:.4rem"><input type="checkbox" data-consent="K" ${S.consentK ? "checked" : ""}> <span>J'accepte l'enregistrement de cette séance</span></label>`}</div>
        </div>
        ${!coachSide && !S.consentK ? `<button class="linkish small" data-consent-demo style="align-self:flex-start">Démo : Claire accepte</button>` : ""}
        <div class="row">${S.recording ? `<button class="btn danger" data-rec="0">Arrêter l'enregistrement</button>` : `<button class="btn primary" data-rec="1" ${both ? "" : 'aria-disabled="true"'}>Démarrer l'enregistrement</button>`}
          <span class="xs meta">${both ? "Chacun peut l'arrêter à tout moment." : "Il faut l'accord des deux."}</span></div>
        <p class="xs meta" style="margin:0">Audio effacé après la transcription ; transcription effacée à 30 jours. Transcription et résumé par une IA hébergée dans l'UE, sans entraînement sur vos données. Inclus dans la séance, sans Plan Quota. Sous-titres en direct dans la visio intégrée.</p>
      </section>
      <aside class="card stack" aria-labelledby="h-app" style="gap:.5rem">
        <h3 id="h-app">Dans la Jobbbox app</h3>
        <div class="note">L'enregistrement et sa transcription se consultent sur le web seulement, sur jobbbox.ai.</div>
        <p class="xs meta" style="margin:0">Le témoin « Enregistrement en cours » reste visible pour les deux participants pendant toute la séance.</p>
      </aside>
    </div>
    <section class="card stack" aria-labelledby="h-sum" style="gap:.6rem">
      <div class="row"><h2 id="h-sum" style="margin:0;font-size:1.05rem">${coachSide ? "Relire le résumé avant de le publier" : "Résumé de la séance"}</h2><span class="sp"></span><span class="ai-label">✦ Généré par IA${S.summaryOk || !coachSide ? ", relu par Claire Martin" : " · à relire"}</span></div>
      ${coachSide ? h`<label class="field"><span>Résumé proposé (modifiable)</span><textarea rows="6">Thèmes abordés : pitch de 2 minutes, réponse à l'objection « surqualifiée », mise en avant des chiffres de la réorganisation logistique.\nProchaines étapes évoquées : candidature Ledger avant le 20 nov. ; préparation de l'entretien Decathlon du 18 nov.</textarea></label>
        <p class="xs meta" style="margin:0">Le résumé reprend ce qui a été dit : aucune émotion déduite, aucune évaluation de Sophie. Rien n'est publié sans votre relecture.</p>
        ${S.summaryOk ? `<div class="note ok" role="status"><b>Résumé publié</b> dans la Coach Conversation de Sophie, marqué « Généré par IA, relu par Claire Martin ».</div>` : ""}
        <div class="row"><button class="btn primary" data-sum>J'ai relu, publier</button><button class="btn">Ne pas publier</button></div>`
      : `<p class="small" style="margin:0">Thèmes abordés : pitch de 2 minutes, réponse à l'objection « surqualifiée », mise en avant des chiffres de la réorganisation logistique. Prochaines étapes évoquées : candidature Ledger avant le 20 nov. ; préparation de l'entretien Decathlon du 18 nov.</p>
        <p class="xs meta" style="margin:0">Généré par IA à partir de la transcription, relu et publié par Claire. Ni émotion déduite, ni évaluation de vous.</p>`}
    </section>
  </div></main>`;
  return { shell: coachSide ? "coach" : "cand", title: `<span class="pill warn" style="font-size:.75rem">Phase suivante</span> Enregistrement et résumé`, body };
}

const RENDER = { choisir: scrChoisir, commande: scrCommande, creneau: scrCreneau, attente: scrAttente, rappel: scrRappel,
  "seance-candidat": scrSeanceCandidat, "seance-coach": scrSeanceCoach, apres: scrApres, annulation: scrAnnulation, "phase-suivante": scrPhase };

// ───────────────────────────── Rendu + barre prototype ─────────────────────────────
function proto() {
  const roleOn = ROLE_SCREENS.includes(S.screen);
  return h`<div class="proto" role="region" aria-label="Barre du prototype">
    <label class="vh" for="p-screen">Écran</label>
    <select id="p-screen" data-pscreen>${Object.entries(SCREENS).map(([k, v]) => `<option value="${k}" ${S.screen === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    ${roleOn ? `<span class="sep" aria-hidden="true"></span><button data-role="candidat" aria-pressed="${S.role === "candidat"}">Candidate</button><button data-role="coach" aria-pressed="${S.role === "coach"}">Coach</button>` : ""}
    <span class="sep" aria-hidden="true"></span><button data-theme aria-pressed="${S.theme === "dark"}">${S.theme === "dark" ? "Sombre" : "Clair"}</button>
  </div>`;
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  const keyOf = (el) => el.tagName + JSON.stringify(el.dataset) + (el.type === "radio" ? el.value : "");
  const active = document.activeElement;
  const focusKey = active && active.dataset && Object.keys(active.dataset).length ? keyOf(active) : null;
  const r = RENDER[S.screen]();
  const shell = r.shell === "coach" ? sidebarCoach() : sidebarCandidate();
  document.getElementById("root").innerHTML =
    `<div class="app ${S.drawer ? "drawer" : ""} ${S.paneOpen === true ? "pane-open" : ""}">${shell}<div class="scrim" data-drawer></div><div class="main">${topbar(r.title, r.top ?? "")}${r.body}</div></div>${proto()}`;
  const th = document.querySelector(".thread");
  if (th && S.screen === "apres") th.scrollTop = th.scrollHeight; // comme une conversation : on arrive sur le plus récent
  document.title = `${SCREENS[S.screen]}${ROLE_SCREENS.includes(S.screen) ? " · " + S.role : ""} — Coaching Session (prototype)`;
  if (focusKey) {
    const el = [...document.querySelectorAll("button, select, input, textarea")].find((e) => keyOf(e) === focusKey);
    el?.focus();
  }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a");
  if (!el) return;
  const d = el.dataset;
  if (el.tagName === "A") e.preventDefault();
  if (el.getAttribute("aria-disabled") === "true") return;
  if (d.drawer !== undefined) return set({ drawer: !S.drawer });
  if (d.theme !== undefined) return set({ theme: S.theme === "dark" ? "light" : "dark" });
  if (d.role) return set({ role: d.role });
  if (d.goRole) { const [s, r] = d.goRole.split(":"); return set({ screen: s, role: r, drawer: false, paneOpen: false }); }
  if (d.go) return set({ screen: d.go, drawer: false, paneOpen: false, role: d.go === "seance-coach" ? "coach" : ["choisir", "commande", "creneau", "attente", "seance-candidat"].includes(d.go) ? "candidat" : S.role });
  if (d.profile) return set({ coach: d.profile, paneOpen: true });
  if (d.paneOpen !== undefined) return set({ paneOpen: true });
  if (d.paneClose !== undefined) return set({ paneOpen: false });
  if (d.book) return set({ coach: d.book, screen: "commande", cgv: false, ipr: false, tried: false, paneOpen: false });
  if (d.pay !== undefined) { if (!(S.cgv && S.ipr)) return set({ tried: true }); return set({ screen: "creneau", paid: true, slot: null, booked: false }); }
  if (d.day) return set({ day: +d.day, slot: null });
  if (d.slot) return set({ slot: +d.slot });
  if (d.confirm !== undefined) return set({ booked: true });
  if (d.coachSlot) return set({ coach: d.coachSlot, screen: "creneau", slot: null, booked: false });
  if (d.unshare !== undefined) return set({ shared: null });
  if (d.reshare !== undefined) return set({ shared: document.querySelector("[data-share]")?.value || "tailored" });
  if (d.slide) return set({ slide: Math.min(3, Math.max(1, S.slide + +d.slide)) });
  if (d.ctab) return set({ ctab: d.ctab });
  if (d.card) { const [k, v] = d.card.split(":"); S.cards[k] = v; return render(); }
  if (d.report !== undefined) return set({ reportSent: true });
  if (d.cancelOk !== undefined) return set({ cancelDone: true });
  if (d.late) return set({ late: d.late === "1" });
  if (d.coachCancel !== undefined) return set({ screen: "annulation", role: "coach", coachCancelled: false, coachTried: false });
  if (d.coachConfirm !== undefined) { if (!S.coachReason.trim()) return set({ coachTried: true }); return set({ coachCancelled: true }); }
  if (d.rec) return set({ recording: d.rec === "1" });
  if (d.consentDemo !== undefined) return set({ consentK: true });
  if (d.sum !== undefined) return set({ summaryOk: true });
});
document.addEventListener("change", (e) => {
  const t = e.target, d = t.dataset;
  if (d.pscreen !== undefined) return set({ screen: t.value, drawer: false, paneOpen: false, role: t.value === "seance-coach" ? "coach" : ROLE_SCREENS.includes(t.value) ? S.role : "candidat" });
  if (d.check) return set({ [d.check]: t.checked });
  if (d.tz !== undefined) return set({ tz: t.value });
  if (d.share !== undefined) return set({ shared: t.value });
  if (d.soon !== undefined) return set({ soon: t.value });
  if (d.cancelChoice !== undefined) { S.cancelChoice = t.value; return; }
  if (d.consent) return set({ ["consent" + d.consent]: t.checked, recording: t.checked ? S.recording : false });
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.notes !== undefined) S.notes = e.target.value;
  if (e.target.dataset.reason !== undefined) S.coachReason = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (S.drawer || S.paneOpen)) set({ drawer: false, paneOpen: false });
});

readUrl();
if (S.screen === "seance-coach") S.role = "coach";
else if (!ROLE_SCREENS.includes(S.screen)) S.role = "candidat";
if (S.screen === "creneau") S.paid = true;
writeUrl(); render();
</script>
</body>
</html>
