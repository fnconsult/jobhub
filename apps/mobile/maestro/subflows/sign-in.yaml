# Sign-in by code (#686, ADR-0083): the run's Candidate asks for their sign-in email, then types the code it holds, which
# the stack's helper reads from the platform's mailbox (scripts/sign-in-code.js).
appId: ai.jobbbox.app
---
# At the largest text size the field is below the screen's fold: scrolled to.
- extendedWaitUntil:
    visible: "Se connecter à Jobbbox"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "sign-in-email"
    direction: DOWN
# iOS sometimes takes the typing before its keyboard is up: typed again until the field shows it (iOS shows a field's
# value to Maestro, Android does not).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "sign-in-email"
      - waitForAnimationToEnd:
          timeout: 3000
      - eraseText
      - inputText: ${STACK_EMAIL}
      - runFlow:
          when:
            platform: iOS
          commands:
            - assertVisible: ${STACK_EMAIL}
- runFlow:
    file: hide-keyboard.yaml
# iOS's email and number keyboards have no key that closes them, and Maestro takes a button the keyboard covers for one
# it can tap (its tap landed on the keyboard's « y »): the keyboard closed as a person closes it, by a tap beside the
# field, on its label (the field, named by it, comes after it).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Votre adresse e-mail"
          index: 0
- scrollUntilVisible:
    element:
      text: "Recevoir mon lien de connexion"
    direction: DOWN
- tapOn: "Recevoir mon lien de connexion"
# The code's field, below the screen's fold at the largest text size on an iPhone SE (the explanation above it takes
# the screen): scrolled to while the email is sent.
- scrollUntilVisible:
    element:
      id: "sign-in-code"
    direction: DOWN
    timeout: 30000
- runScript: ../scripts/sign-in-code.js
- tapOn:
    id: "sign-in-code"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${output.signInCode}
- runFlow:
    file: hide-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Saisir le code reçu par e-mail"
          index: 0
- scrollUntilVisible:
    element:
      text: "Me connecter avec ce code"
    direction: DOWN
- tapOn: "Me connecter avec ce code"
- extendedWaitUntil:
    visible: "Joindre un lien ou un document"
    timeout: 30000
