# Scrolls the conversation until TEXT shows: UP to what came before, DOWN to what follows (DIRECTION). In short, slow
# steps (15 % of the screen's height, no fling), at 40 % of its width: the conversation on every layout, a tablet's
# Sidebar column left of it, its Fiche right of it, and an iPad's Split View, whose app is the left half. Maestro's
# scrollUntilVisible swipes from the screen's middle by some 40 % of its height and wants its element whole: on a folded
# foldable at the largest text size the conversation shows less than that, and the Agenda's Interview was swiped past.
# Until TEXT starts within the thread, below its top and above the conversation's box: iOS gives Maestro an element's
# whole frame, the part the thread clips included, and an iPhone SE's tap on a card under the Top Bar hit the title.
appId: ai.jobbbox.app
---
- runFlow:
    when:
      true: ${DIRECTION == 'UP'}
    commands:
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
              below:
                id: "conversation-thread"
              above:
                id: "conversation-box"
          times: 25
          commands:
            - swipe:
                start: "40%, 30%"
                end: "40%, 45%"
                duration: 800
- runFlow:
    when:
      true: ${DIRECTION == 'DOWN'}
    commands:
      - repeat:
          while:
            notVisible:
              text: ${TEXT}
              below:
                id: "conversation-thread"
              above:
                id: "conversation-box"
          times: 25
          commands:
            - swipe:
                start: "40%, 45%"
                end: "40%, 30%"
                duration: 800
- assertVisible:
    text: ${TEXT}
    below:
      id: "conversation-thread"
    above:
      id: "conversation-box"
