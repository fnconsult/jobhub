<meta charset="utf-8">
<title>Jobbbox Signalement prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  PROTOTYPE (throwaway, never merged): branch prototype/signalement-dialog, for #281 (map #278, amended by ADR-0035 / #345).
  Question: what does the Signalement dialog look like, where does it open, and how does it behave?
  Three variants, switchable from the bar at the bottom (← →, or #A #B #C):
    A · a centred modal, Claude-style (Radix Dialog), type chosen inside it;
    B · inside the Coach Panel, no modal: the panel turns into the form;
    C · two steps anchored to the button that opened it (a popover on wide screens, a bottom sheet on phones).
  Fixed in every variant (decided elsewhere): types Bug / Idée only (2026-10-25: questions go through the Coach Panel's help and AI Coach, never a Signalement); entry points at the Sidebar's foot and at the
  Coach Panel's foot (« Signaler un problème », « Proposer une idée »); none in the Top Bar.
  A Question to the team is never offered on its own: only after the Candidate answers « Non » to « Cela répond à votre
  question ? » under an AI Coach reply (a Help Article's « Non » leads to the coach first). It opens prefilled with their
  question and attaches that exchange (their question and the reply), nothing else of the conversation.
  Assumption: a self-contained page like prototype/candidate-help, so it opens with no database or sign-in.
  Tokens copied from packages/shared/src/design/tokens.ts (light only). Nothing is sent anywhere.
-->
<style>
:root {
  --bg: #ffffff; --surface: #f7f7f5; --surface-hover: #efeeec; --border: #e3e2e0;
  --danger: #b3261e; --danger-surface: #fdf0ee; --text: #37352f; --text-2: #5a5955; --meta: #6b6a67;
  --accent: #1f5fbf; --accent-surface: #eaf1fb; --on-accent: #ffffff; --glyph: #d97757; --ok: #1e6e3a; --ok-surface: #eaf5ee;
  --proto: #1b1a17; --proto-text: #ffffff;
  --fs: 16px; --lh: 1.6;
  --coach-width: clamp(22rem, 34vw, 32rem);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: #d9d8d5; color: var(--text); font-family: var(--sans); }
.stage-wrap { flex: 1; min-height: 0; display: flex; justify-content: center; }
.stage { position: relative; container-type: inline-size; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-size: var(--fs); line-height: var(--lh); }
.stage.phone { width: 390px; max-width: 100%; border-inline: 1px solid var(--border); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.button { display: inline-flex; align-items: center; gap: 0.4em; min-height: 44px; padding: 0 0.9em; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; white-space: nowrap; }
.button:hover { background: var(--surface-hover); }
.button-quiet { border-color: transparent; background: transparent; }
.button-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.button-primary:hover { background: #1a51a3; }
.button[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.icon { width: 1.1em; height: 1.1em; flex: none; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 32px; text-align: left; }
.meta { font-size: 0.8125rem; color: var(--meta); }
.proto-new { outline: 2px dashed var(--glyph); outline-offset: 2px; border-radius: 6px; }

/* Frame */
.app { display: flex; height: 100%; }
.sidebar { width: 15rem; flex: none; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); padding: 0.75rem; gap: 0.25rem; overflow-y: auto; }
.brand { font-weight: 600; font-size: 1.25em; padding: 0.25rem 0.5rem 0.75rem; }
.profile-switch { border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
.profile-switch small { display: block; color: var(--meta); font-size: 0.8125rem; }
.nav-link { display: flex; align-items: center; gap: .5em; text-align: left; width: 100%; padding: 0.45rem 0.75rem; min-height: 40px; border-radius: 6px; border: 0; background: none; cursor: pointer; color: var(--text); }
.nav-link:hover { background: var(--surface-hover); }
.nav-link[aria-current="page"] { font-weight: 600; background: var(--surface-hover); }
.nav-link .count { margin-left: auto; font-size: .8125rem; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 .45em; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.25rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }
.usage { padding: 0.25rem 0.75rem 0.5rem; }
.usage-head { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--meta); }
.usage-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 0.3rem; }
.usage-bar span { display: block; height: 100%; width: 42%; background: var(--accent); }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.app.docked .workspace { margin-right: var(--coach-width); }
.topbar { display: flex; align-items: center; gap: 0.5rem; min-height: 3.5rem; padding: 0.4rem 1rem; border-bottom: 1px solid var(--border); }
.topbar-title { flex: 1; min-width: 0; font-weight: 600; font-size: 1.125em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-title .crumb { font-weight: 400; color: var(--text-2); }
.menu-toggle { display: none; }
.page { flex: 1; overflow-y: auto; padding: 2rem 1.5rem 3rem; }
.page-inner { max-width: 44rem; }
.page h2 { font-size: 1.25em; margin: 2rem 0 0.5rem; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
.score { display: flex; align-items: baseline; gap: 0.75rem; }
.score strong { font-size: 2em; }

/* Coach Panel */
.panel { position: absolute; top: 0; right: 0; bottom: 0; width: var(--coach-width); background: var(--bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 30; }
.panel-head { display: flex; align-items: center; gap: .25rem; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
.panel-title { flex: 1; min-width: 0; font-weight: 600; display: flex; align-items: center; gap: 0.35em; }
.panel-body { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.panel-foot { border-top: 1px solid var(--border); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
.composer { display: flex; align-items: flex-end; gap: 0.5rem; border: 1px solid var(--text-2); border-radius: 10px; padding: 0.4rem 0.4rem 0.4rem 0.75rem; }
.composer textarea { flex: 1; border: 0; resize: none; min-height: 2.6em; background: none; padding: 0.35rem 0; }
.composer textarea:focus { outline: none; }
.composer:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.foot-links { display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
.foot-links .linkish { font-size: .875rem; color: var(--text-2); }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 0.4rem 0.85rem; cursor: pointer; min-height: 40px; }
.this-page { background: var(--accent-surface); border-radius: 10px; padding: 0.9rem 1rem; }
.this-page p { margin: 0 0 .25rem; }

/* Signalement, shared pieces */
.sg-field { display: flex; flex-direction: column; gap: .3rem; }
.sg-field label { font-weight: 600; }
.sg-field textarea { border: 1px solid var(--text-2); border-radius: 8px; padding: .6rem .75rem; min-height: 8.5em; resize: vertical; background: var(--bg); }
.sg-field textarea[aria-invalid="true"] { border-color: var(--danger); }
.sg-count { display: flex; justify-content: space-between; gap: .5rem; }
.sg-count .meta { white-space: nowrap; }
.sg-error { color: var(--danger); font-size: .875rem; }
.sg-context { background: var(--surface); border-radius: 8px; padding: .7rem .85rem; font-size: .875rem; color: var(--text-2); }
.sg-context p { margin: 0; }
.sg-context dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .75rem; margin: .4rem 0 0; }
.sg-context dt { color: var(--meta); }
.sg-context dd { margin: 0; overflow-wrap: anywhere; }
.sg-actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
.sg-done { background: var(--ok-surface); color: var(--ok); border-radius: 10px; padding: .9rem 1rem; }
.sg-done p { margin: 0 0 .35rem; color: var(--text); }
.sg-done strong { color: var(--ok); }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.seg label { min-height: 42px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: .35em; cursor: pointer; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--bg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .14); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 1px; }

/* A: centred modal */
.overlay { position: absolute; inset: 0; background: rgb(15 15 15 / .38); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--bg); border-radius: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / .25); width: min(34rem, 100%); max-height: 100%; overflow-y: auto; padding: 1.25rem 1.25rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
.modal h2 { margin: 0; font-size: 1.25em; display: flex; align-items: center; gap: .45em; }
@container (max-width: 48rem) {
  .overlay { padding: 0; align-items: stretch; }
  .modal { border-radius: 0; width: 100%; }
}

/* B: the panel's form */
.type-cards { display: flex; flex-direction: column; gap: .5rem; border: 0; margin: 0; padding: 0; }
.type-cards legend { font-weight: 600; margin-bottom: .4rem; padding: 0; }
.type-card { display: flex; gap: .7rem; align-items: flex-start; border: 1px solid var(--border); border-radius: 10px; padding: .65rem .8rem; cursor: pointer; position: relative; }
.type-card input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.type-card:has(input:checked) { border-color: var(--accent); background: var(--accent-surface); }
.type-card:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 1px; }
.type-card .icon { margin-top: .25em; }
.type-card span small { display: block; color: var(--meta); font-size: .8125rem; }
.sent-card { border: 1px solid var(--border); border-radius: 10px; padding: .75rem .9rem; }
.sent-card .badge { display: inline-block; font-size: .8125rem; background: var(--accent-surface); color: var(--accent); border-radius: 999px; padding: 0 .55em; }

/* C: anchored popover / bottom sheet */
.pop-scrim { position: absolute; inset: 0; z-index: 50; }
.popover { position: absolute; z-index: 51; width: 24rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 32px rgb(0 0 0 / .2); padding: 1rem; display: flex; flex-direction: column; gap: .8rem; }
.popover h2 { margin: 0; font-size: 1.0625em; display: flex; align-items: center; gap: .4em; }
.big-choices { display: flex; flex-direction: column; gap: .5rem; }
.big-choice { display: flex; align-items: center; gap: .7rem; width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 10px; padding: .7rem .85rem; background: var(--bg); cursor: pointer; min-height: 56px; }
.big-choice:hover { background: var(--surface); }
.big-choice small { display: block; color: var(--meta); font-size: .8125rem; }
details.sg-context summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
@container (max-width: 48rem) {
  .pop-scrim { background: rgb(15 15 15 / .38); }
  .popover { left: 0 !important; right: 0; bottom: 0 !important; top: auto !important; width: auto; border-radius: 14px 14px 0 0; max-height: 92%; overflow-y: auto; }
}
.toast { position: absolute; left: 1rem; bottom: 1rem; z-index: 60; background: var(--text); color: #fff; border-radius: 10px; padding: .7rem .9rem; display: flex; gap: .9rem; align-items: center; box-shadow: 0 6px 20px rgb(0 0 0 / .25); max-width: calc(100% - 2rem); }
.toast .linkish { color: #9cc2ff; }

@container (max-width: 64rem) { .app.docked .workspace { margin-right: 0; } .panel { width: 100%; border-left: 0; } }
@container (max-width: 48rem) {
  .sidebar { position: absolute; inset: 0 auto 0 0; z-index: 25; box-shadow: 4px 0 16px rgb(0 0 0 / .15); }
  .app:not(.menu-open) .sidebar { display: none; }
  .menu-toggle { display: inline-flex; }
  .page { padding: 1.25rem 1rem 3rem; }
  .hide-narrow { display: none; }
}

/* Prototype switcher: not part of the design */
.proto-bar { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--proto); color: var(--proto-text); padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); font-size: 13px; line-height: 1.3; }
.proto-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.proto-bar button { background: #34332f; color: var(--proto-text); border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.proto-bar button:hover { background: #4a4944; }
.proto-label { font-weight: 600; padding: 0 4px; text-align: center; }
.proto-state { opacity: 0.75; font-size: 12px; text-align: center; }
</style>

<div class="stage-wrap"><div class="stage" id="stage"></div></div>
<div class="proto-bar" role="region" aria-label="Prototype">
  <div class="proto-row">
    <button type="button" id="prev" aria-label="Variante précédente">←</button>
    <span class="proto-label" id="variant-label"></span>
    <button type="button" id="next" aria-label="Variante suivante">→</button>
    <button type="button" id="phone">Téléphone</button>
    <button type="button" id="size">Texte 16 px</button>
    <button type="button" id="reset">Remettre à zéro</button>
  </div>
  <div class="proto-state" id="proto-state"></div>
</div>

<script>
const VARIANTS = {
  A: "A · Fenêtre au centre, façon Claude",
  B: "B · Dans le panneau « Aide et coach », sans fenêtre",
  C: "C · En deux temps, accrochée au bouton (feuille en bas sur téléphone)",
};
const KEYS = Object.keys(VARIANTS);
const MIN = 10, MAX = 2000;

const ICON = {
  bug: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V5M9 4l1.5 2M15 4l-1.5 2M8 11H4M20 11h-4M8 15H5M19 15h-3M12 11v8"/></svg>',
  idee: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="16" r="3.5"/><rect x="13" y="12.5" width="7" height="7" rx="1"/><path d="M12 3.5l4 6.5H8z"/></svg>',
  question: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>',
  signal: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V5M8 11H4M20 11h-4M8 15H5M19 15h-3"/></svg>',
  menu: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  help: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>',
  back: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>',
  collapse: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/></svg>',
};
const TYPES = {
  bug: { name: "Bug", action: "Signaler un problème", label: "Décrivez le problème", hint: "Quelque chose ne marche pas ou s'affiche mal.", ph: "Ce que vous faisiez, ce qui s'est passé, ce que vous attendiez." },
  idee: { name: "Idée", action: "Proposer une idée", label: "Décrivez votre idée", hint: "Ce qui vous aiderait dans Jobbbox.", ph: "Ce que vous aimeriez pouvoir faire, et pourquoi." },
  // Never offered on its own: only after the help and the AI Coach did not satisfy the Candidate (2026-10-25).
  question: { name: "Question", action: "Poser la question à l'équipe", label: "Votre question", hint: "Une personne de l'équipe Jobbbox vous répond dans Jobbbox.", ph: "Votre question, avec ce qui manquait dans la réponse." },
};
const TKEYS = ["bug", "idee"]; // the types a Candidate can choose

const SIZES = [16, 17, 18, 20];
const SIZE_NAMES = ["Normal", "Grand", "Plus grand", "Très grand"];
const fresh = () => ({
  variant: KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "A",
  panelOpen: false, menuOpen: false, phone: false, size: 0, draft: "",
  sg: null, // { type, text, from, step, error, contextOpen, done }
  sent: [], toast: null, messages: [],
});
let S = fresh();
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const narrow = () => $("#stage").clientWidth <= 768;

function context() {
  const x = S.sg?.exchange;
  return [
    ...(x ? [["Échange", `Votre question et ${x.source === "coach" ? "la réponse du coach (IA)" : "l'article « " + x.answer + " »"}`]] : []),
    ["Page", "/candidatures/8f2c…/correspondance"],
    ["Version", "Jobbbox 0.42.0"],
    ["Navigateur", S.phone ? "Safari 18, iPhone" : "Chrome 141, Mac"],
    ["Langue", "Français"],
    ["Taille du texte", SIZE_NAMES[S.size]],
  ];
}
const contextSentence = () => S.sg?.exchange
  ? "Joints automatiquement : votre échange avec l'aide et coach (votre question et la réponse reçue), la page, la version de Jobbbox, votre navigateur, la langue et la taille du texte. Rien d'autre de la conversation."
  : "Joints automatiquement : la page, la version de Jobbbox, votre navigateur, la langue et la taille du texte. Ni capture d'écran, ni conversation avec votre coach.";
const contextList = () => `<dl>${context().map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

/* ---------- Frame ---------- */
function sidebar() {
  const entryLabel = S.variant === "C" ? "Signaler ou proposer" : "Signalement";
  return `<nav class="sidebar" aria-label="Navigation principale">
    <div class="brand">Jobbbox</div>
    <div class="profile-switch"><small>Profil</small>Directeur administratif et financier</div>
    ${["Accueil", "Mes profils", "Recherches d'offres"].map((l) => `<button class="nav-link" type="button" disabled>${l}</button>`).join("")}
    <button class="nav-link" type="button" aria-current="page">Mes candidatures</button>
    ${["Agenda", "Coachs"].map((l) => `<button class="nav-link" type="button" disabled>${l}</button>`).join("")}
    <div class="sidebar-foot">
      <div class="usage"><div class="usage-head"><span>Hebdomadaire</span><span>42 %</span></div><div class="usage-bar"><span></span></div></div>
      <button class="nav-link proto-new" type="button" id="sg-sidebar" data-sg-open="" data-from="sg-sidebar">${ICON.signal} ${entryLabel}</button>
      <button class="nav-link" type="button" data-mine>Mon compte${S.sent.length ? `<span class="count" title="Signalements envoyés">${S.sent.length}</span>` : ""}</button>
      <button class="nav-link" type="button" disabled>Se déconnecter</button>
      <button class="nav-link" type="button" disabled>${ICON.collapse} Masquer le menu</button>
    </div>
  </nav>`;
}

function panel() {
  if (!S.panelOpen) return "";
  const inForm = S.variant === "B" && S.sg;
  const head = inForm
    ? `<button class="button button-quiet" type="button" data-sg-cancel>${ICON.back} Conversation</button><span class="panel-title">Signalement</span>`
    : `<span class="panel-title">${ICON.help} Aide et coach · Nouvelle conversation ▾</span>`;
  const body = inForm ? formB() : panelHome();
  const foot = inForm ? "" : `<form class="composer" data-ask><textarea id="box" rows="1" aria-label="Votre question" placeholder="Votre question">${esc(S.draft)}</textarea><button class="button button-primary" type="submit">Envoyer au coach</button></form>
    <div class="foot-links proto-new">${TKEYS.map((k) => `<button class="linkish" type="button" id="sg-foot-${k}" data-sg-open="${k}" data-from="sg-foot-${k}">${TYPES[k].action}</button>`).join("")}</div>`;
  return `<aside class="panel" aria-label="Aide et coach"><div class="panel-head">${head}<button class="button button-quiet" type="button" data-panel-close>Fermer</button></div>
    <div class="panel-body" id="panel-body">${body}</div>${foot ? `<div class="panel-foot">${foot}</div>` : ""}</aside>`;
}
function panelHome() {
  const sentCards = S.variant === "B" ? S.sent.map(sentCard).join("") : "";
  return `<p>Bonjour. Posez votre question : je cherche d'abord dans l'aide de Jobbbox, et votre coach répond si l'aide n'a pas la réponse.</p>
    <section class="this-page"><p class="meta">Sur cette page</p><p><strong>La page d'une candidature</strong></p><p>Elle rassemble l'offre, le score de correspondance, vos documents adaptés et vos relances.</p></section>
    <section><p class="meta" style="margin:0 0 .4rem">Souvent demandé</p><div class="chips"><button class="chip" type="button" data-article-quota>Quand mon quota se renouvelle-t-il ?</button><button class="chip" type="button">Comment signaler un problème ?</button></div></section>
    ${sentCards}${messagesHtml()}`;
}
const fbRow = (i) => `<div class="feedback" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.4rem"><span class="meta">Cela répond à votre question ?</span><button class="button" type="button" data-fb="yes" data-i="${i}">Oui</button><button class="button" type="button" data-fb="no" data-i="${i}">Non</button></div>`;
function messagesHtml() {
  return S.messages.map((m, i) => {
    if (m.me) return `<div style="align-self:flex-end;max-width:85%;background:var(--surface-hover);border-radius:10px;padding:.5rem .8rem">${esc(m.text)}</div>`;
    const head = m.article ? `<div class="meta">Aide · écrit par l'équipe Jobbbox</div><p style="margin:.2rem 0"><strong>${esc(m.title)}</strong></p>` : `<div class="meta"><span style="color:var(--glyph)">✳</span> Votre coach · IA</div>`;
    let after = "";
    if (m.fb === null) after = fbRow(i);
    else if (m.fb === "yes") after = `<p class="meta" role="status" style="margin:.4rem 0 0">Merci, c'est noté.</p>`;
    else if (m.article) after = `<div class="proto-new" style="margin-top:.5rem;padding:.6rem .7rem;background:var(--surface);border-radius:8px"><p style="margin:0 0 .4rem">L'article ne suffit pas : votre coach peut vous répondre.</p><button class="button" type="button" data-ask-coach="${i}">Demander à mon coach</button></div>`;
    else if (m.escalated) after = `<p class="meta" style="margin:.4rem 0 0">Question envoyée à l'équipe. Vous suivez sa réponse dans Mon compte › Mes signalements.</p>`;
    else after = `<div class="proto-new" style="margin-top:.5rem;padding:.6rem .7rem;background:var(--surface);border-radius:8px"><p style="margin:0 0 .4rem">Désolé que la réponse ne suffise pas. Une personne de l'équipe Jobbbox peut vous répondre, dans Jobbbox.</p><button class="button" type="button" id="sg-esc-${i}" data-sg-open="question" data-from="sg-esc-${i}" data-i="${i}">Poser la question à l'équipe</button></div>`;
    return `<div class="${m.article ? "card" : ""}" style="max-width:95%">${head}<p style="margin:.2rem 0">${esc(m.text)}</p>${after}</div>`;
  }).join("");
}
function sentCard(s) {
  return `<div class="sent-card"><div class="meta">Signalement · ${TYPES[s.type].name} · envoyé à l'instant</div><p style="margin:.3rem 0">${esc(s.text.length > 120 ? s.text.slice(0, 120) + "…" : s.text)}</p>
    <span class="badge">Nouveau</span> <span class="meta">· la réponse de l'équipe arrive dans Mon compte › Mes signalements</span></div>`;
}

function page() {
  return `<div class="page-inner">
    <h2 style="margin-top:0">Score de correspondance</h2>
    <div class="card score"><strong>78</strong><span>sur 100 · bonne correspondance</span></div>
    <p>Ce qui colle : contrôle de gestion, consolidation, SAP. Ce qui manque : l'anglais courant est demandé, votre CV dit « professionnel ».</p>
    <h2>Relances</h2><p>Postulée le 9 octobre, sans réponse. Votre coach proposera une relance à partir du 23 octobre.</p>
    ${S.mine ? mineHtml() : ""}
  </div>`;
}
function mineHtml() {
  return `<h2>Mes signalements <span class="meta">(aperçu, #282 décide de la vraie page)</span></h2>${S.sent.length ? S.sent.map(sentCard).join("") : `<p class="meta">Aucun signalement envoyé.</p>`}`;
}

/* ---------- The form, shared by A and C ---------- */
function fieldHtml() {
  const g = S.sg, t = TYPES[g.type];
  const n = g.text.trim().length;
  return `<div class="sg-field">
      <label for="sg-text">${t.label}</label>
      <textarea id="sg-text" maxlength="${MAX}" placeholder="${t.ph}" aria-describedby="sg-count${g.error ? " sg-err" : ""}" ${g.error ? 'aria-invalid="true"' : ""}>${esc(g.text)}</textarea>
      <div class="sg-count"><span id="sg-err" class="sg-error" ${g.error ? 'role="alert"' : ""}>${g.error || ""}</span><span id="sg-count" class="meta">${n} / ${MAX}</span></div>
    </div>`;
}
function typeSeg() {
  if (S.sg.type === "question") return `<p class="meta" style="margin:-.5rem 0 0">${TYPES.question.hint}</p>`;
  return `<div class="seg" role="radiogroup" aria-label="Type de signalement">${TKEYS.map((k) => `<label>${ICON[k]}<input type="radio" name="sg-type" value="${k}" ${S.sg.type === k ? "checked" : ""}>${TYPES[k].name}</label>`).join("")}</div>`;
}
function doneHtml(inline) {
  const s = S.sent[S.sent.length - 1];
  return `<div class="sg-done" role="status"><strong>Merci, c'est envoyé.</strong>
    <p>L'équipe Jobbbox lit chaque signalement. Vous suivez son statut dans Mon compte › Mes signalements.</p></div>
    <div class="sg-actions">${inline ? "" : `<button class="button" type="button" data-mine-go>Voir mes signalements</button>`}<button class="button button-primary" type="button" data-sg-close>Fermer</button></div>`;
}

/* A: centred modal */
function dialogA() {
  const g = S.sg;
  if (g.done) return `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="sg-title"><h2 id="sg-title">${ICON.signal} Signalement envoyé</h2>${doneHtml()}</div></div>`;
  return `<div class="overlay" data-overlay><form class="modal" role="dialog" aria-modal="true" aria-labelledby="sg-title" data-sg-form>
    <h2 id="sg-title">${ICON.signal} ${g.type === "question" ? TYPES.question.action : "Envoyer un signalement"}</h2>
    ${typeSeg()}
    ${fieldHtml()}
    <div class="sg-context"><p>${contextSentence()} <button class="linkish" type="button" data-ctx>${g.contextOpen ? "Masquer le détail" : "Voir le détail"}</button></p>${g.contextOpen ? contextList() : ""}</div>
    <div class="sg-actions"><button class="button" type="button" data-sg-cancel>Annuler</button><button class="button button-primary" type="submit">Envoyer</button></div>
  </form></div>`;
}

/* B: in the panel */
function formB() {
  const g = S.sg;
  if (g.done) return doneHtml(true);
  return `<form data-sg-form style="display:flex;flex-direction:column;gap:1rem">
    ${g.type === "question" ? `<h2 style="margin:0;font-size:1.125em">${TYPES.question.action}</h2><p class="meta" style="margin:-.5rem 0 0">${TYPES.question.hint}</p>` : `<fieldset class="type-cards"><legend>Que voulez-vous nous dire ?</legend>
      ${TKEYS.map((k) => `<label class="type-card">${ICON[k]}<input type="radio" name="sg-type" value="${k}" ${g.type === k ? "checked" : ""}><span><strong>${TYPES[k].action}</strong><small>${TYPES[k].hint}</small></span></label>`).join("")}
    </fieldset>`}
    ${fieldHtml()}
    <div class="sg-context"><p><strong>Joint automatiquement</strong></p>${contextList()}<p class="meta" style="margin-top:.4rem">${g.exchange ? "Rien d'autre de la conversation, ni capture d'écran." : "Ni capture d'écran, ni conversation avec votre coach."}</p></div>
    <div class="sg-actions"><button class="button" type="button" data-sg-cancel>Annuler</button><button class="button button-primary" type="submit">Envoyer</button></div>
  </form>`;
}

/* C: two steps anchored to the trigger */
function dialogC() {
  const g = S.sg;
  let inner;
  if (!g.type) {
    inner = `<h2 id="sg-title">Que voulez-vous nous dire ?</h2><div class="big-choices">${TKEYS.map((k) => `<button class="big-choice" type="button" data-pick="${k}">${ICON[k]}<span><strong>${TYPES[k].action}</strong><small>${TYPES[k].hint}</small></span></button>`).join("")}</div>
      <div class="sg-actions"><button class="button button-quiet" type="button" data-sg-cancel>Annuler</button></div>`;
  } else {
    inner = `<h2 id="sg-title">${ICON[g.type]} ${TYPES[g.type].action}</h2>
      <p class="meta" style="margin:-.5rem 0 0">${TYPES[g.type].hint} ${g.type === "question" ? "" : `<button class="linkish" type="button" data-pick="">Changer</button>`}</p>
      ${fieldHtml()}
      <details class="sg-context" ${g.contextOpen ? "open" : ""} data-ctx-details><summary>Ce qui est joint (${context().length} éléments)</summary>${contextList()}<p class="meta" style="margin-top:.4rem">${g.exchange ? "Rien d'autre de la conversation, ni capture d'écran." : "Ni capture d'écran, ni conversation avec votre coach."}</p></details>
      <div class="sg-actions"><button class="button" type="button" data-sg-cancel>Annuler</button><button class="button button-primary" type="submit">Envoyer</button></div>`;
  }
  return `<div class="pop-scrim" data-overlay></div><form class="popover" id="popover" role="dialog" aria-modal="true" aria-labelledby="sg-title" data-sg-form>${inner}</form>`;
}
function placePopover() {
  const pop = $("#popover"), trg = document.getElementById(S.sg.from);
  if (!pop || !trg || narrow()) return;
  const st = $("#stage").getBoundingClientRect(), r = trg.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left - st.left), st.width - pop.offsetWidth - 8);
  pop.style.left = left + "px";
  pop.style.top = Math.max(8, r.top - st.top - pop.offsetHeight - 8) + "px";
}

/* ---------- Render ---------- */
function render() {
  const st = $("#stage");
  const keepFocus = document.activeElement?.id;
  const caret = document.activeElement?.selectionStart;
  st.classList.toggle("phone", S.phone);
  st.style.setProperty("--fs", SIZES[S.size] + "px");
  const dialog = S.sg && S.variant === "A" ? dialogA() : S.sg && S.variant === "C" ? dialogC() : "";
  st.innerHTML = `<div class="app ${S.panelOpen && !narrow() ? "docked" : ""} ${S.menuOpen ? "menu-open" : ""}" ${dialog ? "inert" : ""}>
    ${sidebar()}
    <div class="workspace">
      <header class="topbar">
        <button class="button button-quiet menu-toggle" type="button" data-menu>${ICON.menu} Menu</button>
        <div class="topbar-title">Contrôleur de gestion · Groupe Arvel <span class="crumb">› Correspondance</span></div>
        ${S.panelOpen && !narrow() ? "" : `<button class="button" type="button" title="Activité IA (#314)">✳ <span class="hide-narrow">Activité IA</span></button><button class="button" type="button" data-panel-open>${ICON.help} ${narrow() ? "Aide" : "Aide et coach"}</button>`}
      </header>
      <main class="page">${page()}</main>
    </div>
    ${panel()}
  </div>${dialog}${S.toast ? `<div class="toast" role="status">${S.toast} <button class="linkish" type="button" data-mine-go>Voir</button><button class="linkish" type="button" data-toast-x aria-label="Fermer">✕</button></div>` : ""}`;
  if (S.variant === "C" && S.sg) placePopover();
  if (keepFocus && document.getElementById(keepFocus)) { const el = document.getElementById(keepFocus); el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
  $("#variant-label").textContent = VARIANTS[S.variant];
  $("#phone").textContent = S.phone ? "Bureau" : "Téléphone";
  $("#size").textContent = "Texte " + SIZES[S.size] + " px";
  const g = S.sg;
  $("#proto-state").textContent = (g ? `Ouvert depuis ${g.from} · type ${g.type ?? "à choisir"} · ${g.text.trim().length} car.${g.done ? " · envoyé" : ""}` : "Fermé")
    + ` · brouillon gardé : ${S.kept ? "oui" : "non"} · envoyés : ${S.sent.length}`;
  if (location.hash.slice(1) !== S.variant) history.replaceState(null, "", "#" + S.variant);
}
function focusFirst() {
  const root = S.variant === "B" ? $("#panel-body") : $("[role=dialog]");
  if (!root) return;
  const target = S.sg?.done ? root.querySelector("[data-sg-close]") : (S.sg?.type && (S.sg.from.startsWith("sg-foot") || S.sg.type === "question" || S.variant !== "A")) ? root.querySelector("#sg-text") : root.querySelector("input:checked, input, button");
  target?.focus();
}

/* ---------- Behaviour ---------- */
function openSg(type, from, i) {
  if (type === "question") { // only from a coach reply the Candidate said did not answer them
    const m = S.messages[i];
    S.sg = { type, text: m.q, from, msg: i, exchange: { source: "coach", question: m.q, answer: m.text }, error: "", contextOpen: false, done: false };
    S.menuOpen = false; if (S.variant === "B") S.panelOpen = true;
    render(); focusFirst(); return;
  }
  const kept = S.kept && (!type || S.kept.type === type) ? S.kept : null;
  S.sg = { type: type || kept?.type || (S.variant === "C" ? null : "bug"), text: kept?.text || "", from, error: "", contextOpen: false, done: false };
  S.kept = null; S.menuOpen = false;
  if (S.variant === "B") S.panelOpen = true;
  render(); focusFirst();
}
function closeSg() {
  const g = S.sg; if (!g) return;
  if (!g.done && g.text.trim() && g.type !== "question") S.kept = { type: g.type, text: g.text }; // a closed draft comes back next time
  S.sg = null; render();
  document.getElementById(g.from)?.focus() || (S.variant === "B" && $("#box")?.focus());
}
function submitSg() {
  const g = S.sg, n = g.text.trim().length;
  if (!g.type) return;
  if (n < MIN) { g.error = n ? `Encore ${MIN - n} caractères au moins, pour que l'équipe comprenne.` : "Écrivez quelques mots avant d'envoyer."; render(); $("#sg-text")?.focus(); return; }
  S.sent.push({ type: g.type, text: g.text.trim() });
  if (g.type === "question") S.messages[g.msg].escalated = true;
  if (S.variant === "C") { const from = g.from; S.sg = null; S.toast = `Signalement envoyé. Vous le suivez dans Mon compte.`; render(); document.getElementById(from)?.focus(); return; }
  g.done = true; render(); focusFirst();
}

document.addEventListener("click", (e) => {
  if (!e.target.closest("#stage")) return;
  if (e.target.matches("[data-overlay]") && S.sg) return closeSg();
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if ("sgOpen" in d) return openSg(d.sgOpen, d.from, +d.i);
  if ("fb" in d) { S.messages[+d.i].fb = d.fb; render(); return; }
  if ("askCoach" in d) return askCoach(S.messages[+d.askCoach].q);
  if ("articleQuota" in d) { S.panelOpen = true; S.messages.push({ article: true, title: "Quand mon quota se renouvelle-t-il ?", q: "Quand mon quota se renouvelle-t-il ?", text: "Chaque lundi à 0 h. La barre « Hebdomadaire », en bas du menu, montre où vous en êtes.", fb: null }); render(); return; }
  if ("sgCancel" in d || "sgClose" in d) return closeSg();
  if ("pick" in d) { S.sg.type = d.pick || null; S.sg.error = ""; render(); focusFirst(); return; }
  if ("ctx" in d) { S.sg.contextOpen = !S.sg.contextOpen; render(); return; }
  if ("panelOpen" in d) S.panelOpen = true;
  else if ("panelClose" in d) { S.panelOpen = false; if (S.variant === "B") S.sg = null; }
  else if ("menu" in d) S.menuOpen = !S.menuOpen;
  else if ("mine" in d || "mineGo" in d) { S.mine = true; S.sg = null; S.toast = null; S.menuOpen = false; }
  else if ("toastX" in d) S.toast = null;
  else return;
  render();
});
document.addEventListener("change", (e) => {
  if (e.target.name === "sg-type") { S.sg.type = e.target.value; S.sg.error = ""; render(); $(`input[name=sg-type][value=${S.sg.type}]`)?.focus(); }
});
document.addEventListener("toggle", (e) => { if (e.target.matches?.("[data-ctx-details]")) S.sg.contextOpen = e.target.open; }, true);
document.addEventListener("input", (e) => {
  if (e.target.id === "box") S.draft = e.target.value;
  if (e.target.id === "sg-text") {
    S.sg.text = e.target.value;
    if (S.sg.error && S.sg.text.trim().length >= MIN) { S.sg.error = ""; render(); return; }
    $("#sg-count").textContent = `${S.sg.text.trim().length} / ${MAX}`;
  }
});
document.addEventListener("submit", (e) => { e.preventDefault(); if ("sgForm" in e.target.dataset) submitSg(); if ("ask" in e.target.dataset) askCoach(S.draft); });
function askCoach(q) {
  if (!q?.trim()) return;
  S.messages.push({ me: true, text: q.trim() }, { q: q.trim(), text: "Voici ce que je comprends de votre question, à partir de votre profil et de la page ouverte. (Prototype : réponse écrite d'avance, aucun appel à l'IA.)", fb: null });
  S.draft = ""; render(); const b = $("#panel-body"); if (b) b.scrollTop = b.scrollHeight;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sg && !S.sg.done) { e.preventDefault(); return closeSg(); }
  if (e.key === "Escape" && S.sg?.done) return closeSg();
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "sg-text") { e.preventDefault(); return submitSg(); }
  if (e.key === "Tab" && S.sg && S.variant !== "B") { // focus stays in the dialog (Radix does this for real)
    const f = [...document.querySelectorAll("[role=dialog] button, [role=dialog] input:checked, [role=dialog] textarea, [role=dialog] summary")];
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "ArrowLeft") cycle(-1);
});
function cycle(n) { const i = KEYS.indexOf(S.variant); S.variant = KEYS[(i + n + KEYS.length) % KEYS.length]; S.sg = null; S.toast = null; render(); }
$("#prev").onclick = () => cycle(-1);
$("#next").onclick = () => cycle(1);
$("#phone").onclick = () => { S.phone = !S.phone; render(); };
$("#size").onclick = () => { S.size = (S.size + 1) % SIZES.length; render(); };
$("#reset").onclick = () => { const v = S.variant, ph = S.phone; S = fresh(); S.variant = v; S.phone = ph; render(); };
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (KEYS.includes(v) && v !== S.variant) { S.variant = v; S.sg = null; render(); } });
let wasNarrow = null;
new ResizeObserver(() => { const n = narrow(); if (n !== wasNarrow) { wasNarrow = n; render(); } }).observe(document.querySelector(".stage-wrap"));
render();
</script>
