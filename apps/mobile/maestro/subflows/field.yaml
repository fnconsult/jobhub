# Types VALUE in the field whose testID is FIELD: an input's label is its accessible name on iOS, not one Maestro finds
# on Android, so fields are found by their id. Then closes the keyboard: Android's back; on iOS, whose keyboards may have
# no key that closes them and whose covered buttons Maestro still takes for tappable, a tap on the field's label LABEL,
# as a person closes it (the field, named by its label, comes after it).
appId: ai.jobbbox.app
---
- tapOn:
    id: ${FIELD}
- inputText: ${VALUE}
- runFlow:
    file: hide-keyboard.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: ${LABEL}
          index: 0
